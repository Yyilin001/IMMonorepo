# Overlay for docker-compose.production-smoke.yml. It introduces a second Cell
# without changing the base single-Cell smoke topology. Control-plane state
# stays in the primary smoke database, while Cell B owns a separate physical
# conversation-shard database. This makes cross-Cell copy/cutover testable.
x-multicell-ingress-env: &multicell_ingress_env
  IM_CELL_INGRESS_SHARED_SECRET: production-smoke-internal-secret
  IM_CELL_INGRESS_COMMAND_ENDPOINTS: cell-a=http://command-api:8080,cell-b=http://command-api-cell-b:8080
  IM_CELL_INGRESS_QUERY_ENDPOINTS: cell-a=http://query-api:8080,cell-b=http://query-api-cell-b:8080
  IM_CELL_INGRESS_REALTIME_ENDPOINTS: cell-a=http://gateway:8080,cell-b=http://gateway-cell-b:8080

# Command-owner routing is intentionally scoped to one Cell. Cross-Cell
# traffic is owned by the conversation directory and must not enter the
# command-owner hash ring of a different Cell.
x-cell-b-command-owner-env: &cell_b_command_owner_env
  IM_COMMAND_NODE_URLS: command-b=http://command-api-cell-b:8080

# A Kafka event only carries a shard ID, which is local to the source Cell.
# Keep Cell B events in a distinct topic so its consumers never resolve its
# shard-0 events against Cell A's equally named physical shard.
x-cell-b-event-stream-env: &cell_b_event_stream_env
  IM_KAFKA_TOPIC: conversation-domain-events-cell-b
  IM_KAFKA_DEAD_LETTER_TOPIC: conversation-domain-events-cell-b-dead-letter
  IM_KAFKA_CLIENT_ID: imserver-production-smoke-cell-b

services:
  postgres-cell-b:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: imserver_smoke_cell_b
      POSTGRES_USER: imserver
      POSTGRES_PASSWORD: imserver_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imserver -d imserver_smoke_cell_b"]
      interval: 5s
      timeout: 5s
      retries: 20

  ops:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  # Runs the same schema set against Cell B's conversation shard before any
  # serving role can accept a remote migration page.
  ops-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: ops
    environment:
      <<: [*multicell_ingress_env, *cell_b_command_owner_env]
      IM_NODE_ID: ops-b
      IM_REALTIME_CELL_ID: cell-b
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
  # Cell B owns only its physical conversation shard. `summary-0` is inherited
  # from the base environment and explicitly points at the shared control-plane
  # database, so owner-domain delivery and summary rows stay globally routable.
    command:
      - >-
        ./IMServer ops --env production-smoke >/tmp/ops.log 2>&1 &
        child=$$!;
        for attempt in $$(seq 1 240); do
          if grep -Fq "IM ops role initialized." /tmp/ops.log; then
            kill "$$child" 2>/dev/null || true;
            wait "$$child" 2>/dev/null || true;
            cat /tmp/ops.log;
            exit 0;
          fi;
          if ! kill -0 "$$child" 2>/dev/null; then
            cat /tmp/ops.log;
            wait "$$child";
            exit $$?;
          fi;
          sleep 1;
        done;
        cat /tmp/ops.log;
        kill "$$child" 2>/dev/null || true;
        wait "$$child" 2>/dev/null || true;
        exit 1
    depends_on:
      postgres-cell-b:
        condition: service_healthy

  gateway:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  command-api:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  query-api:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  outbox-relay:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  # Each Cell owns the outbox records written to its physical conversation
  # shard, so Cell B needs an independent publisher after a migration cutover.
  outbox-relay-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: outbox-relay
    environment:
      <<: [*multicell_ingress_env, *cell_b_event_stream_env, *cell_b_command_owner_env]
      IM_NODE_ID: outbox-relay-b
      IM_REALTIME_CELL_ID: cell-b
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully

  # Each Cell consumes only the Kafka topic produced by its own physical
  # conversation shards. The control-plane databases and presence backend are
  # shared, but source conversation rows must never be read through another
  # Cell's local shard name.
  stream-consumer-summary-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: stream-consumer-summary
    environment:
      <<: [*multicell_ingress_env, *cell_b_event_stream_env, *cell_b_command_owner_env]
      IM_NODE_ID: stream-summary-b
      IM_REALTIME_CELL_ID: cell-b
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully

  stream-consumer-changes-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: stream-consumer-changes
    environment:
      <<: [*multicell_ingress_env, *cell_b_event_stream_env, *cell_b_command_owner_env]
      IM_NODE_ID: stream-changes-b
      IM_REALTIME_CELL_ID: cell-b
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully

  stream-consumer-search-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: stream-consumer-search
    environment:
      <<: [*multicell_ingress_env, *cell_b_event_stream_env, *cell_b_command_owner_env]
      IM_NODE_ID: stream-search-b
      IM_REALTIME_CELL_ID: cell-b
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully

  stream-consumer-notification-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: stream-consumer-notification
    environment:
      <<: [*multicell_ingress_env, *cell_b_event_stream_env, *cell_b_command_owner_env]
      IM_NODE_ID: stream-notification-b
      IM_REALTIME_CELL_ID: cell-b
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully

  stream-consumer-repair-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: stream-consumer-repair
    environment:
      <<: [*multicell_ingress_env, *cell_b_event_stream_env, *cell_b_command_owner_env]
      IM_NODE_ID: stream-repair-b
      IM_REALTIME_CELL_ID: cell-b
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully

  stream-consumer-domain-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: stream-consumer-domain
    environment:
      <<: [*multicell_ingress_env, *cell_b_event_stream_env, *cell_b_command_owner_env]
      IM_NODE_ID: stream-domain-b
      IM_REALTIME_CELL_ID: cell-b
      IM_GATEWAY_INTERNAL_BASE_URL: http://gateway-cell-b:8080
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully

  stream-consumer-realtime-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: stream-consumer-realtime
    environment:
      <<: [*multicell_ingress_env, *cell_b_event_stream_env, *cell_b_command_owner_env]
      IM_NODE_ID: stream-realtime-b
      IM_REALTIME_CELL_ID: cell-b
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully

  stream-consumer-summary:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  stream-consumer-changes:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  stream-consumer-search:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  stream-consumer-notification:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  stream-consumer-repair:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  stream-consumer-domain:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  stream-consumer-realtime:
    environment:
      <<: *multicell_ingress_env
      IM_REALTIME_CELL_ID: cell-a

  gateway-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: gateway
    environment:
      <<: [*multicell_ingress_env, *cell_b_command_owner_env]
      IM_NODE_ID: gateway-b
      IM_REALTIME_CELL_ID: cell-b
      IM_COMMAND_API_INTERNAL_BASE_URL: http://command-api-cell-b:8080
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully
    ports: !override
      - "18080:8080"
      - "9002:9001"

  command-api-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: command-api
    environment:
      <<: [*multicell_ingress_env, *cell_b_command_owner_env]
      IM_NODE_ID: command-api-b
      IM_COMMAND_NODE_ID: command-b
      IM_REALTIME_CELL_ID: cell-b
      IM_GATEWAY_INTERNAL_BASE_URL: http://gateway-cell-b:8080
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully
    ports: !override
      - "18081:8080"

  query-api-cell-b:
    extends:
      file: docker-compose.production-smoke.yml
      service: query-api
    environment:
      <<: [*multicell_ingress_env, *cell_b_command_owner_env]
      IM_NODE_ID: query-api-b
      IM_REALTIME_CELL_ID: cell-b
      DATABASE_CONVERSATION_SHARD_0_HOST: postgres-cell-b
      DATABASE_CONVERSATION_SHARD_0_PORT: "5432"
      DATABASE_CONVERSATION_SHARD_0_NAME: imserver_smoke_cell_b
      DATABASE_CONVERSATION_SHARD_0_USERNAME: imserver
      DATABASE_CONVERSATION_SHARD_0_PASSWORD: imserver_password
    depends_on:
      ops-cell-b:
        condition: service_completed_successfully
    ports: !override
      - "18082:8080"
