x-imserver-build: &imserver_build
  # A prebuilt Linux/ARM64 image can be loaded on the target host before the
  # smoke starts. Keep the normal tag as the default for local Docker builds.
  image: ${IMSERVER_IMAGE:-imserver:production-smoke}
  build:
    context: .

x-imserver-env: &imserver_env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  JWT_SECRET: ${JWT_SECRET:-production-smoke-jwt-secret-change-me}
  IM_INTERNAL_SHARED_SECRET: ${IM_INTERNAL_SHARED_SECRET:-production-smoke-internal-secret}
  IM_COMMAND_INTERNAL_SHARED_SECRET: ${IM_COMMAND_INTERNAL_SHARED_SECRET:-production-smoke-internal-secret}
  IM_HTTP_MAX_BODY_SIZE_BYTES: "1048576"
  IM_GROUP_MEMBER_LIMIT: "10000"
  IM_METRICS_ENABLED: "true"
  # The capacity campaign prewarms tens of thousands of distinct sessions
  # before a long TCP ramp. Keep its shared validation cache alive for the
  # token lifetime so the online-capacity run does not silently fall back to
  # per-session database validation part-way through the ramp.
  AUTH_SESSION_CACHE_TTL_SECONDS: "7200"
  AUTH_SESSION_CACHE_MAX_TTL_SECONDS: "7200"
  AUTH_ACCESS_TOKEN_TTL_SECONDS: "7200"
  AUTH_SESSION_CACHE_REDIS_MAX_CONNECTIONS: "16"
  AUTH_LOGIN_IP_MAX_ATTEMPTS: "2000"
  IM_AUTO_MIGRATE_ON_START: "false"
  IM_INLINE_OUTBOX_PROJECTION: "false"
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: imserver_smoke
  DATABASE_USERNAME: imserver
  DATABASE_PASSWORD: imserver_password
  DATABASE_PRIMARY_HOST: postgres
  DATABASE_PRIMARY_PORT: "5432"
  DATABASE_PRIMARY_NAME: imserver_smoke
  DATABASE_PRIMARY_USERNAME: imserver
  DATABASE_PRIMARY_PASSWORD: imserver_password
  # Keep control-plane summaries in their own database. The single logical
  # summary shard uses this generic summary connection, avoiding duplicate
  # Fluent migration registrations for two aliases of the same database.
  DATABASE_SUMMARY_HOST: postgres
  DATABASE_SUMMARY_PORT: "5432"
  DATABASE_SUMMARY_NAME: imserver_smoke_summary
  DATABASE_SUMMARY_USERNAME: imserver
  DATABASE_SUMMARY_PASSWORD: imserver_password
  IM_CONVERSATION_SHARD_IDS: shard-0
  IM_SUMMARY_SHARD_IDS: summary-0
  IM_SUMMARY_PROJECTION_WRITE_MODE: sharded
  IM_SUMMARY_QUERY_READ_SOURCE: sharded
  IM_EVENT_STREAM_DRIVER: kafka
  IM_KAFKA_BROKERS: redpanda:9092
  IM_KAFKA_TOPIC: conversation-domain-events
  IM_KAFKA_DEAD_LETTER_TOPIC: conversation-domain-events-dead-letter
  IM_KAFKA_CLIENT_ID: imserver-production-smoke
  IM_KAFKA_SECURITY_PROTOCOL: plaintext
  IM_KAFKA_COMPRESSION: none
  IM_KAFKA_AUTO_CREATE_TOPICS: "true"
  # Keep enough partition parallelism for concurrent hot conversations. This
  # smoke topology can override the value, while a new environment defaults
  # to the 12-partition capacity-test baseline.
  IM_KAFKA_TOPIC_PARTITIONS: "${IM_KAFKA_TOPIC_PARTITIONS:-12}"
  IM_KAFKA_POLL_INTERVAL_MS: "10"
  REDIS_URL: redis://redis:6379
  IM_ROUTING_MODE: redis
  IM_REDIS_MAX_CONNECTIONS: "32"
  # Connection presence is registered on auth and removed on close. Do not
  # rewrite one Redis lease per TCP heartbeat; the longer node lease covers
  # abrupt process loss without putting the heartbeat path on Redis.
  IM_REDIS_PRESENCE_HEARTBEAT_TIMEOUT_SECONDS: "600"
  IM_GATEWAY_LOCAL_FANOUT_BATCH_SIZE: "512"
  IM_GATEWAY_LOCAL_FANOUT_EVENT_LOOP_YIELD_CHUNKS: "32"
  DATABASE_GATEWAY_MAX_CONNECTIONS_PER_EVENT_LOOP: "2"
  DATABASE_GATEWAY_CONNECTION_POOL_TIMEOUT_SECONDS: "30"
  IM_COMMAND_API_INTERNAL_BASE_URL: http://command-api:8080
  IM_GATEWAY_RELAY_MODE: http
  IM_GATEWAY_INTERNAL_BASE_URL: http://gateway:8080
  IM_COMMAND_NODE_URLS: command-a=http://command-api:8080
  IM_SEQUENCE_ALLOCATION_MODE: block
  IM_SEQUENCE_BLOCK_SIZE: "256"
  IM_MESSAGE_WRITE_BATCH_ENABLED: "true"
  IM_MESSAGE_WRITE_BATCH_MAX_SIZE: "32"
  IM_MESSAGE_WRITE_BATCH_MAX_DELAY_MS: "10"
  IM_MESSAGE_CREATED_RECIPIENT_INLINE_THRESHOLD: "500"
  IM_DOMAIN_EVENT_RECIPIENT_SNAPSHOT_DEDUP_THRESHOLD: "500"
  IM_STREAM_CONSUMER_REQUIRE_MESSAGE_CREATED_RECIPIENT_SNAPSHOT: "true"
  IM_STREAM_CONSUMER_QUEUE_CAPACITY: "1024"
  IM_STREAM_CONSUMER_RUN_BATCH_SIZE: "64"
  IM_STREAM_CONSUMER_BATCH_FILL_WAIT_MS: "10"
  IM_DOMAIN_DELIVERY_MESSAGE_CREATED_LARGE_GROUP_MODE: timeline-pull
  IM_DOMAIN_DELIVERY_MESSAGE_CREATED_OWNER_DELIVERY_SKIP_RECIPIENT_THRESHOLD: "500"
  IM_DOMAIN_DELIVERY_LARGE_MEMBERSHIP_OWNER_DELIVERY_SKIP_RECIPIENT_THRESHOLD: "500"
  IM_DOMAIN_DELIVERY_OWNER_RECORD_BATCH_MAX_REQUESTS: "128"
  IM_NOTIFICATION_MESSAGE_CREATED_OWNER_NOTIFICATION_SKIP_RECIPIENT_THRESHOLD: "500"
  IM_SUMMARY_PROJECTION_MESSAGE_CREATED_ACTIVITY_ONLY_RECIPIENT_THRESHOLD: "500"
  IM_SUMMARY_PROJECTION_ACTIVITY_COALESCE_WINDOW_MS: "100"
  IM_SUMMARY_RESPONSE_MEMBER_USER_IDS_LIMIT: "100"
  IM_REALTIME_ACTIVE_CONVERSATION_FANOUT_ENABLED: "true"
  IM_REALTIME_ACTIVE_CONVERSATION_FANOUT_RECIPIENT_THRESHOLD: "500"
  IM_REALTIME_MESSAGE_CREATED_LIGHTWEIGHT_RECIPIENT_THRESHOLD: "500"
  IM_REALTIME_MESSAGE_CREATED_PREVIEW_LOOKUP_ENABLED: "false"
  IM_REALTIME_DELIVERY_ASYNC_RELAY_ENABLED: "true"
  # Realtime hints are at-least-once and clients dedupe by event/sequence. Keep
  # durable replay records on domain delivery, not on this hot fanout path.
  IM_REALTIME_DELIVERY_REPLAY_RECORDS_ENABLED: "false"
  IM_REALTIME_DELIVERY_ASYNC_MAX_IN_FLIGHT: "32"
  IM_REALTIME_DELIVERY_ASYNC_MAX_QUEUED: "4096"
  IM_REALTIME_MESSAGE_CREATED_COALESCE_WINDOW_MS: "100"
  IM_REALTIME_ACTIVE_COMPACT_HINT_COALESCE_WINDOW_MS: "100"
  IM_REALTIME_ACTIVE_COMPACT_HINT_PREVIEW_MAX_CHARS: "80"
  IM_TIMELINE_SINCE_HOT_CACHE_TTL_MS: "500"
  IM_TIMELINE_SINCE_HOT_CACHE_MAX_ENTRIES: "4096"
  IM_TIMELINE_SINCE_RECENT_CACHE_TTL_MS: "5000"
  IM_TIMELINE_SINCE_RECENT_CACHE_MAX_CONVERSATIONS: "1024"
  IM_TIMELINE_SINCE_RECENT_CACHE_MAX_ITEMS_PER_CONVERSATION: "256"
  IM_TIMELINE_SINCE_TARGET_SEQUENCE_COALESCE_WINDOW_MS: "25"
  IM_TIMELINE_SINCE_CACHE_INVALIDATION_MODE: redis
  # A full multi-Cell smoke topology runs many short-lived roles on the same
  # PostgreSQL instance. Keep each pool deliberately small; the test verifies
  # routing and migration, not database pool saturation.
  DATABASE_MAX_CONNECTIONS_PER_EVENT_LOOP: "1"
  IM_HOT_CONVERSATION_MSG_PER_SECOND_LIMIT: "1000"
  IM_SEARCH_DRIVER: database
  MEDIA_STORAGE_PROVIDER: s3compatible
  MEDIA_STORAGE_DIRECTORY: /app/Storage/media
  MEDIA_STORAGE_S3_ENDPOINT: http://minio:9000
  MEDIA_STORAGE_S3_BUCKET: imserver-media
  MEDIA_STORAGE_S3_ACCESS_KEY_ID: imserver-smoke-minio
  MEDIA_STORAGE_S3_SECRET_ACCESS_KEY: smoke-minio-secret-012345
  MEDIA_STORAGE_S3_REGION: us-east-1
  MEDIA_STORAGE_S3_FORCE_PATH_STYLE: "true"
  IM_PRODUCTION_ALLOW_INSECURE_MEDIA_STORAGE_ENDPOINT: "true"
  FILE_STORAGE_DIRECTORY: /app/Storage/files

x-imserver-depends: &imserver_depends
  postgres-init:
    condition: service_completed_successfully
  redpanda:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy
  redpanda-init:
    condition: service_completed_successfully
  minio-init:
    condition: service_completed_successfully

x-imserver-runtime-depends: &imserver_runtime_depends
  <<: *imserver_depends
  ops:
    condition: service_completed_successfully

x-imserver-worker-healthcheck: &imserver_worker_healthcheck
  test: ["CMD-SHELL", "kill -0 1"]
  interval: 30s
  timeout: 5s
  start_period: 30s
  retries: 3

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: imserver_smoke
      POSTGRES_USER: imserver
      POSTGRES_PASSWORD: imserver_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imserver -d imserver_smoke"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: imserver_password
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if ! psql -h postgres -U imserver -d imserver_smoke -tAc "SELECT 1 FROM pg_database WHERE datname = 'imserver_smoke_summary'" | grep -qx 1; then psql -h postgres -U imserver -d imserver_smoke -c "CREATE DATABASE imserver_smoke_summary"; fi

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "timeout 10 rpk cluster health --exit-when-healthy >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 30

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    environment:
      IM_KAFKA_TOPIC_PARTITIONS: "${IM_KAFKA_TOPIC_PARTITIONS:-12}"
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "rpk topic create conversation-domain-events --brokers redpanda:9092 --partitions $${IM_KAFKA_TOPIC_PARTITIONS} --replicas 1 || true;
       rpk topic create conversation-domain-events-dead-letter --brokers redpanda:9092 --partitions $${IM_KAFKA_TOPIC_PARTITIONS} --replicas 1 || true;
       rpk topic create conversation-domain-events-cell-b --brokers redpanda:9092 --partitions $${IM_KAFKA_TOPIC_PARTITIONS} --replicas 1 || true;
       rpk topic create conversation-domain-events-cell-b-dead-letter --brokers redpanda:9092 --partitions $${IM_KAFKA_TOPIC_PARTITIONS} --replicas 1 || true"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: imserver-smoke-minio
      MINIO_ROOT_PASSWORD: smoke-minio-secret-012345
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set smoke http://minio:9000 imserver-smoke-minio smoke-minio-secret-012345 &&
       mc mb --ignore-existing smoke/imserver-media"

  ops:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: ops-a
      IM_AUTO_MIGRATE_ON_START: "true"
    depends_on: *imserver_depends
    # The CLI completes the verification but can retain an idle runtime task
    # during shutdown. This smoke-only wrapper converts that verified state
    # into the Compose completion signal consumed by serving roles.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        ./IMServer --verify-conversation-summaries --env production-smoke >/tmp/ops.log 2>&1 &
        child=$$!;
        for attempt in $(seq 1 240); do
          if grep -Fq "Conversation summary verification completed" /tmp/ops.log; then
            kill "$$child" 2>/dev/null || true;
            wait "$$child" 2>/dev/null || true;
            cat /tmp/ops.log;
            exit 0;
          fi;
          if ! kill -0 "$$child" 2>/dev/null; then
            cat /tmp/ops.log;
            wait "$$child";
            exit $$?;
          fi;
          sleep 1;
        done;
        cat /tmp/ops.log;
        kill "$$child" 2>/dev/null || true;
        wait "$$child" 2>/dev/null || true;
        exit 1

  gateway:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: gateway-a
      IM_TCP_ENABLED: "true"
      IM_TCP_HOST: "0.0.0.0"
      IM_TCP_PORT: "9000"
      IM_TCP_AUTH_TIMEOUT: "30"
      IM_TCP_IDLE_TIMEOUT: "300"
      IM_TCP_LISTEN_BACKLOG: "8192"
      IM_TCP_MAX_CONNECTIONS: "${IM_TCP_MAX_CONNECTIONS:-300000}"
      IM_TCP_MAX_NEW_CONNECTIONS_PER_SECOND: "${IM_TCP_MAX_NEW_CONNECTIONS_PER_SECOND:-2000}"
    depends_on: *imserver_runtime_depends
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "8080:8080"
      - "9000:9000"
    command: ["serve", "--env", "production-smoke", "--hostname", "0.0.0.0", "--port", "8080", "--role", "gateway"]

  command-api:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: command-a
      IM_COMMAND_NODE_ID: command-a
      IM_TCP_ENABLED: "false"
    depends_on: *imserver_runtime_depends
    ports:
      - "8081:8080"
    command: ["serve", "--env", "production-smoke", "--hostname", "0.0.0.0", "--port", "8080", "--role", "command-api"]

  query-api:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: query-a
      IM_RUNTIME_ROLE: query-api
      IM_TCP_ENABLED: "false"
    depends_on: *imserver_runtime_depends
    ports:
      - "8082:8080"
    command: ["serve", "--env", "production-smoke", "--hostname", "0.0.0.0", "--port", "8080"]

  outbox-relay:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: outbox-relay-a
      IM_TCP_ENABLED: "false"
    depends_on: *imserver_runtime_depends
    healthcheck: *imserver_worker_healthcheck
    command: ["outbox-relay", "--env", "production-smoke"]

  stream-consumer-summary:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: stream-summary-a
      IM_TCP_ENABLED: "false"
      IM_STREAM_CONSUMER_GROUPS: summary-projection-consumer
    depends_on: *imserver_runtime_depends
    healthcheck: *imserver_worker_healthcheck
    command: ["stream-consumer", "--env", "production-smoke"]

  stream-consumer-changes:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: stream-changes-a
      IM_TCP_ENABLED: "false"
      IM_STREAM_CONSUMER_GROUPS: changes-log-consumer
    depends_on: *imserver_runtime_depends
    healthcheck: *imserver_worker_healthcheck
    command: ["stream-consumer", "--env", "production-smoke"]

  stream-consumer-search:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: stream-search-a
      IM_TCP_ENABLED: "false"
      IM_STREAM_CONSUMER_GROUPS: search-index-consumer
    depends_on: *imserver_runtime_depends
    healthcheck: *imserver_worker_healthcheck
    command: ["stream-consumer", "--env", "production-smoke"]

  stream-consumer-notification:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: stream-notification-a
      IM_TCP_ENABLED: "false"
      IM_STREAM_CONSUMER_GROUPS: notification-consumer
    depends_on: *imserver_runtime_depends
    healthcheck: *imserver_worker_healthcheck
    command: ["stream-consumer", "--env", "production-smoke"]

  stream-consumer-repair:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: stream-repair-a
      IM_TCP_ENABLED: "false"
      IM_STREAM_CONSUMER_GROUPS: repair-replay-consumer
    depends_on: *imserver_runtime_depends
    healthcheck: *imserver_worker_healthcheck
    command: ["stream-consumer", "--env", "production-smoke"]

  stream-consumer-domain:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: stream-domain-a
      IM_TCP_ENABLED: "false"
      IM_STREAM_CONSUMER_GROUPS: domain-delivery-consumer
      IM_DOMAIN_DELIVERY_RELAY_AFTER_RECORD: "false"
      IM_DOMAIN_DELIVERY_EXTERNAL_REALTIME_DELIVERY_ENABLED: "true"
      IM_GATEWAY_RELAY_MODE: http
      IM_GATEWAY_INTERNAL_BASE_URL: http://gateway:8080
    depends_on: *imserver_runtime_depends
    healthcheck: *imserver_worker_healthcheck
    command: ["stream-consumer", "--env", "production-smoke"]

  stream-consumer-realtime:
    <<: *imserver_build
    environment:
      <<: *imserver_env
      IM_NODE_ID: stream-realtime-a
      IM_TCP_ENABLED: "false"
      IM_STREAM_CONSUMER_GROUPS: realtime-delivery-consumer
    depends_on: *imserver_runtime_depends
    healthcheck: *imserver_worker_healthcheck
    command: ["stream-consumer", "--env", "production-smoke"]
