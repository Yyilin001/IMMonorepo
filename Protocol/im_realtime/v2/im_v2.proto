syntax = "proto3";

package im.realtime.v2;

option swift_prefix = "IMV2";
option java_package = "com.xmtx.imclientkit.generated.im.realtime.v2";
option java_multiple_files = true;

// Every field below belongs to the current protocol contract. Required domain
// facts are validated after protobuf decoding rather than inferred from gaps.
message Envelope {
  uint64 request_id = 1;
  uint32 protocol_version = 2;

  reserved 22, 45, 47, 49, 53, 55, 58, 67, 68, 69, 70, 71, 72, 73, 74, 76, 80, 97, 99, 101, 103;
  reserved "begin_group_room_creation", "append_group_room_creation_members", "finalize_group_room_creation", "cancel_group_room_creation", "group_room_created", "group_room_creation_prepared", "group_room_creation_members_appended", "group_room_creation_cancelled", "set_stranger_message_permission", "change_relationship", "change_user_block", "set_user_add_permission", "set_read_receipt_preferences", "set_live_activity_preferences", "change_room_membership", "mute_member", "moderate_member_removal", "set_pinned_message", "set_group_announcement", "set_group_role_permissions", "change_group_member_role";
  reserved 43, 44;
  reserved "open_direct_room", "direct_room_opened";
  reserved 51, 52;
  reserved "moderate_message", "message_redacted";
  reserved 20, 24, 26, 28, 105, 106;
  reserved "send_message", "withdraw_message", "change_message_reaction", "edit_message", "forward_messages", "messages_forwarded";
  oneof body {
    DeviceRoomProgressReport device_room_progress_report = 131;
    DeviceRoomProgressRecorded device_room_progress_recorded = 132;
    RealtimeCoverage realtime_coverage = 130;
    MessageSendOperation message_send_operation = 127;
    MessageSendOperationRecover message_send_operation_recover = 128;
    MessageSendOperationResult message_send_operation_result = 129;
    PresencePublicationControl presence_publication_control = 125;
    PresencePublicationControlled presence_publication_controlled = 126;
    ClientHello client_hello = 10;
    ServerHello server_hello = 11;
    Authenticate authenticate = 12;
    Authenticated authenticated = 13;
    Heartbeat heartbeat = 14;
    HeartbeatAck heartbeat_ack = 15;
    MessageAccepted message_accepted = 21;
    MembershipChanged membership_changed = 23;
    MessageWithdrawn message_withdrawn = 25;
    MessageReactionChanged message_reaction_changed = 27;
    MessageEdited message_edited = 29;
    SyncPull sync_pull = 30;
    SyncBatch sync_batch = 31;
    SyncAck sync_ack = 32;
    ResetRequired reset_required = 33;
    SnapshotAck snapshot_ack = 34;
    Acknowledged acknowledged = 35;
    SyncSnapshot sync_snapshot = 36;
    SnapshotManifest snapshot_manifest = 37;
    SnapshotPagePull snapshot_page_pull = 38;
    SnapshotPage snapshot_page = 39;
    SyncAvailable sync_available = 40;
    RecordReadReceipt record_read_receipt = 41;
    ReadReceiptRecorded read_receipt_recorded = 42;
    StrangerMessagePermissionSet stranger_message_permission_set = 46;
    RelationshipChanged relationship_changed = 48;
    UserBlockChanged user_block_changed = 50;
    MemberMuted member_muted = 54;
    MemberRemovedByModerator member_removed_by_moderator = 56;
    ListRoomMembers list_room_members = 59;
    RoomMembersPage room_members_page = 60;
    GroupEventPull group_event_pull = 61;
    GroupEventPage group_event_page = 62;
    GroupEventSubscribe group_event_subscribe = 63;
    GroupEventSubscribed group_event_subscribed = 64;
    GroupEventUnsubscribe group_event_unsubscribe = 65;
    // Server initiated, request_id = 0. This is a non-authoritative wake;
    // clients always read authorized durable events with GroupEventPull. A
    // standard group uses this only for an active-view preview; its reliable
    // delivery and ACK still use the personal sync stream.
    GroupEventAvailable group_event_available = 66;
    UserAddPermissionSet user_add_permission_set = 75;
    ReadReceiptPreferencesSet read_receipt_preferences_set = 77;
    ListReadReceiptReaders list_read_receipt_readers = 78;
    ReadReceiptReadersPage read_receipt_readers_page = 79;
    LiveActivityPreferencesSet live_activity_preferences_set = 81;
    SubscribePresence subscribe_presence = 82;
    PresenceSubscribed presence_subscribed = 83;
    UnsubscribePresence unsubscribe_presence = 84;
    SubscribeTyping subscribe_typing = 85;
    UnsubscribeTyping unsubscribe_typing = 86;
    SetTypingState set_typing_state = 87;
    TypingStateChanged typing_state_changed = 88;
    PresenceChanged presence_changed = 89;
    Error error = 90;
    GetLiveActivityPreferences get_live_activity_preferences = 91;
    LiveActivityPreferences live_activity_preferences = 92;
    SetConversationState set_conversation_state = 93;
    ConversationStateSet conversation_state_set = 94;
    SetMessageFavorite set_message_favorite = 95;
    MessageFavoriteChanged message_favorite_changed = 96;
    PinnedMessageChanged pinned_message_changed = 98;
    GroupAnnouncementChanged group_announcement_changed = 100;
    GroupRolePermissionsChanged group_role_permissions_changed = 102;
    GroupMemberRoleChanged group_member_role_changed = 104;
    GetGroupRolePolicyBaseline get_group_role_policy_baseline = 107;
    GroupRolePolicyBaseline group_role_policy_baseline = 108;
    UserRoomDirectoryList user_room_directory_list = 111;
    UserRoomDirectoryPage user_room_directory_page = 112;
    RoomSyncStateBatch room_sync_state_batch = 113;
    RoomSyncStateBatchResult room_sync_state_batch_result = 114;
    AccountRoomChangesStart account_room_changes_start = 115;
    AccountRoomChangesReady account_room_changes_ready = 116;
    AccountRoomResyncRequired account_room_resync_required = 118;
    RoomLatestVisibleBatch room_latest_visible_batch = 119;
    RoomLatestVisibleBatchResult room_latest_visible_batch_result = 120;
    // Optional, recipient-specific, ephemeral supplement; never a message ACK.
    AuthorPresentationDelta author_presentation_delta = 121;
    AuthorPresentationEnd author_presentation_end = 122;
    AuthorPresentationEnded author_presentation_ended = 123;
    PersonalPreferenceReceipt personal_preference_receipt = 124;
    AuthorPresentationReceipt author_presentation_receipt = 133;
    AuthorPresentationReceipt author_presentation_receipted = 134;
    AuthorPresentationInterests author_presentation_interests = 135;
    AuthorPresentationInterests author_presentation_interests_received = 136;
    AuthorPresentationStart author_presentation_start = 137;
    AuthorPresentationStart author_presentation_started = 138;
  }
}

// These user-owned controls are synced only to the actor's devices. They
// never fan out to other room members and each operation is durable/retryable.
message SetConversationState {
  string operation_id = 1;
  string room_id = 2;
  bool is_pinned = 3;
  bool is_archived = 4;
  int64 mute_until_ms = 5; // zero means not muted
  uint64 expected_revision = 6;
  uint64 first_submission_deadline_ms = 7;
}
message ConversationStateSet {
  string room_id = 1;
  bool is_pinned = 2;
  bool is_archived = 3;
  int64 mute_until_ms = 4;
  int64 updated_at_ms = 5;
  uint64 revision = 6;
}
message SetMessageFavorite { string operation_id = 1; string room_id = 2; string message_id = 3; bool is_favorited = 4; uint64 expected_revision = 5; uint64 first_submission_deadline_ms = 6; }
message MessageFavoriteChanged { string room_id = 1; string message_id = 2; bool is_favorited = 3; int64 updated_at_ms = 4; uint64 revision = 5; }

// The immutable outcome of the original command, never a later current snapshot.
message PersonalPreferenceReceipt {
  enum Kind { KIND_UNSPECIFIED = 0; CONVERSATION_STATE = 1; MESSAGE_FAVORITE = 2; }
  string actor_user_id = 1;
  string operation_id = 2;
  string room_id = 3;
  string message_id = 4;
  Kind kind = 5;
  uint32 fingerprint_version = 6;
  bytes fingerprint = 7;
  uint64 resolved_at_ms = 8;
  oneof outcome {
    ConversationStateSet conversation_state = 9;
    MessageFavoriteChanged message_favorite = 10;
    PersonalPreferenceRejection rejected = 11;
    bool closed = 12; // must be true
  }
}
message PersonalPreferenceRejection {
  enum Reason { REASON_UNSPECIFIED = 0; REVISION_CONFLICT = 1; PERMISSION_DENIED = 2; NOT_FOUND = 3; EXPIRED_UNSUBMITTED = 4; }
  Reason reason = 1;
  optional uint64 current_revision = 2; // required only for REVISION_CONFLICT
}

// Group state is a room event. All changes are sequenced and delivered using
// the room's existing fan-out mode; the gateway never trusts a client role.

message PinnedMessageChanged { string room_id = 1; string message_id = 2; bool is_pinned = 3; uint64 room_sequence = 4; int64 updated_at_ms = 5; }

message GroupAnnouncementChanged { string room_id = 1; string body = 2; uint64 revision = 3; uint64 room_sequence = 4; int64 updated_at_ms = 5; }
message GroupRolePermission { string permission = 1; }
// A complete current observation, not two fabricated role-change events.
message GetGroupRolePolicyBaseline { string room_id = 1; }
message GroupRolePolicy { string role = 1; repeated GroupRolePermission permissions = 2; }
message GroupRolePolicyBaseline {
  string room_id = 1;
  uint64 permission_revision = 2;
  uint64 membership_revision = 3; // zero is a valid initial membership fence
  uint64 room_sequence = 4;
  repeated GroupRolePolicy policies = 5; // exactly admin and member, even when empty
}

message GroupRolePermissionsChanged { string room_id = 1; string role = 2; repeated GroupRolePermission permissions = 3; uint64 revision = 4; uint64 room_sequence = 5; }

message GroupMemberRoleChanged { string room_id = 1; string user_id = 2; string role = 3; uint64 membership_revision = 4; uint64 room_sequence = 5; }

// A forward creates a distinct message for each source/target pair. Results
// are per pair so callers can report partial target failures without retrying
// successful output. Source message order is preserved inside each target.





message Acknowledged {}

// Compression is negotiated explicitly before either peer may set the frame
// compressed flag. Every compressed frame is an independent member so loss,
// reconnect and cursor recovery never depend on hidden transport state.
enum FrameCompression {
  FRAME_COMPRESSION_UNSPECIFIED = 0;
  FRAME_COMPRESSION_ZLIB = 1;
}

message ClientHello {
  repeated uint32 supported_protocol_versions = 1;
  repeated string supported_capability_profiles = 2;
  // Required installation identity; Authenticate must repeat this exact ID.
  string device_id = 3;
  repeated FrameCompression supported_frame_compressions = 4;
  bool supports_author_presentation_delta = 5;
  bool supports_message_send_operations = 6;
}

message ServerHello {
  uint32 selected_protocol_version = 1;
  string selected_capability_profile = 2;
  int64 server_time_ms = 3;
  FrameCompression selected_frame_compression = 4;
  // Empty unless explicitly negotiated; repeated exactly by Authenticated.
  string author_presentation_stream_id = 5;
  bool supports_message_send_operations = 6;
  uint32 maximum_message_send_payload_bytes = 7;
}

message Authenticate {
  bool presence_publication_suppressed = 3;
  string access_token = 1;
  string device_id = 2;
}

message Authenticated {
  string user_id = 1;
  string device_id = 2;
  string selected_capability_profile = 3;
  FrameCompression selected_frame_compression = 4;
  // Empty unless explicitly negotiated; repeated exactly by Authenticated.
  string author_presentation_stream_id = 5;
  bool supports_message_send_operations = 6;
  uint32 maximum_message_send_payload_bytes = 7;
}

// v45 full send operation. Identity and both fingerprints are derived from
// these exact typed fields, never from protobuf serialization bytes.
message MessageSendOperation {
  string room_id = 1;
  string sender_user_id = 2;
  string client_message_id = 3;
  string text = 4;
  repeated string media_ids = 5;
  repeated MessageSendMention mentions = 6;
  repeated MessageSendEntity entities = 7;
  optional string reply_to_message_id = 8;
  uint64 first_submission_deadline_ms = 9;
  uint32 domain_fingerprint_version = 10;
  bytes domain_fingerprint = 11;
  uint32 fingerprint_version = 12;
  bytes fingerprint = 13;
}
message MessageSendMention {
  oneof target {
    string user_id = 1;
    bool everyone = 2; // must be true
  }
}
message MessageSendEntity {
  uint32 offset_utf16 = 1;
  uint32 length_utf16 = 2;
  string kind = 3;
  optional string link_url = 4;
}
message MessageSendOperationIdentity {
  string account_id = 1;
  string room_id = 2;
  string operation_id = 3;
}
message MessageSendOperationFingerprint {
  uint32 version = 1;
  bytes digest = 2;
}
message MessageSendOperationRecover {
  MessageSendOperationIdentity identity = 1;
  MessageSendOperationFingerprint fingerprint = 2;
  MessageSendOperationFingerprint domain_fingerprint = 3;
  reserved 4;
  reserved "action";
}
message MessageSendOperationAcceptance {
  string message_id = 1;
  uint64 room_sequence = 2;
}
message MessageSendOperationRejection {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    EXPIRED_UNSUBMITTED = 1;
    PERMISSION_DENIED = 2;
    ROOM_NOT_FOUND = 3;
    INVALID_CONTENT = 4;
    DIRECT_POLICY_DENIED = 5;
  }
  Reason reason = 1;
}
message MessageSendOperationReceipt {
  reserved 6;
  reserved "closed";
  MessageSendOperationIdentity identity = 1;
  MessageSendOperationFingerprint fingerprint = 2;
  uint64 resolved_at_ms = 3;
  oneof outcome {
    MessageSendOperationAcceptance accepted = 4;
    MessageSendOperationRejection rejected = 5;
  }
}
message MessageSendOperationRetryHint {
  MessageSendOperationIdentity identity = 1;
  MessageSendOperationFingerprint fingerprint = 2;
  enum Reason { REASON_UNSPECIFIED = 0; RATE_LIMITED = 1; ADMISSION_UNAVAILABLE = 2; }
  Reason reason = 3;
  optional uint64 retry_after_ms = 4;
}
message MessageSendOperationResult {
  oneof result {
    MessageSendOperationRetryHint deferred = 1;
    MessageSendOperationReceipt receipt = 2;
    bool unresolved = 3; // must be true
    bool fingerprint_conflict = 4; // must be true
  }
}

// Heartbeats exchange connection-local room progress without granting authority
// or renewing leases. Reports describe this device's committed local cursor.
message Heartbeat {
  uint64 client_time_ms = 1;
  // At most one: the connection's installed foreground detail-room scope.
  repeated GroupEventProgress room_progress = 2;
}

message HeartbeatAck {
  int64 server_time_ms = 1;
  // Returned even without a report, from the exact live local subscription.
  repeated GroupEventProgressState room_subscription_states = 2;
}

// A report is advisory device progress, never a permission or delivery proof.
message GroupEventProgress {
  string room_id = 1;
  uint64 scope_generation = 2;
  uint64 applied_room_sequence = 3;
}

// Independent of detail-room subscriptions. The authenticated connection
// supplies user/device identity; at most 64 distinct rooms per request.
// Send only after local events and cursor commit atomically. The Gateway checks
// each report against a current online room grant before persisting the batch.
message DeviceRoomCursor {
  string room_id = 1;
  uint64 applied_through = 2;
}
message DeviceRoomProgressReport {
  repeated DeviceRoomCursor rooms = 1;
}
// Success confirms storage of this device's report, not authorization, message
// read status, or permission to retire room history. Never advances local data.
message DeviceRoomProgressRecorded {
  repeated DeviceRoomCursor rooms = 1;
}
message GroupEventProgressState {
  string room_id = 1;
  uint64 scope_generation = 2;
  uint64 high_watermark = 3;
  // Last accepted report; clients must never use it to advance local storage.
  uint64 applied_room_sequence = 4;
  // Actual socket Ready admission for this exact subscription authorization.
  bool ready = 5;
}

// Live activity is intentionally ephemeral. It is never appended to a room
// log, user sync stream, or notification payload. A client must explicitly
// subscribe while the relevant conversation is visible.


message LiveActivityPreferencesSet {
  bool allows_online_presence = 1;
  bool allows_typing_indicators = 2;
  int64 updated_at_ms = 3;
}

message GetLiveActivityPreferences {}
message LiveActivityPreferences {
  bool allows_online_presence = 1;
  bool allows_typing_indicators = 2;
  int64 updated_at_ms = 3;
}

// Presence is deliberately limited to one direct room. The server derives
// the counterpart from active membership; callers may not name arbitrary
// users to watch.
message SubscribePresence { string room_id = 1; }
message PresenceSubscribed {
  string room_id = 1;
  string target_user_id = 2;
  bool is_online = 3;
  int64 expires_at_ms = 4;
}
message UnsubscribePresence { string room_id = 1; }

// Typing may be observed only while subscribed to a currently authorized
// room. `is_typing=true` is lease based and expires server-side; clients send
// an explicit false value when a draft is cleared or the view disappears.
message SubscribeTyping { string room_id = 1; }
message UnsubscribeTyping { string room_id = 1; }
message SetTypingState { string room_id = 1; bool is_typing = 2; }
message TypingStateChanged {
  string room_id = 1;
  string user_id = 2;
  bool is_typing = 3;
  int64 expires_at_ms = 4;
}
message PresenceChanged {
  string room_id = 1;
  string target_user_id = 2;
  bool is_online = 3;
  int64 expires_at_ms = 4;
}



message MessageContent {
  oneof body {
    string text = 1;
  }
  // Opaque, upload-authorized media identifiers. Object locations, names and
  // bearer URLs are deliberately absent from the realtime protocol.
  repeated string media_ids = 2;
  repeated string mentioned_user_ids = 3;
  bool mention_everyone = 4;
  repeated MessageEntity entities = 5;
  // The gateway resolves this opaque ID in the same room while accepting the
  // message; a client may never select a cross-room reply target.
  string reply_to_message_id = 6;
}

enum MessageEntityKind {
  MESSAGE_ENTITY_KIND_UNSPECIFIED = 0;
  MESSAGE_ENTITY_KIND_BOLD = 1;
  MESSAGE_ENTITY_KIND_ITALIC = 2;
  MESSAGE_ENTITY_KIND_UNDERLINE = 3;
  MESSAGE_ENTITY_KIND_STRIKETHROUGH = 4;
  MESSAGE_ENTITY_KIND_SPOILER = 5;
  MESSAGE_ENTITY_KIND_CODE = 6;
  MESSAGE_ENTITY_KIND_PREFORMATTED = 7;
  MESSAGE_ENTITY_KIND_LINK = 8;
}

message MessageEntity {
  uint32 offset_utf16 = 1;
  uint32 length_utf16 = 2;
  MessageEntityKind kind = 3;
  string link_url = 4;
}

// Presentation facts are derived from the scanned media object at acceptance
// time. They intentionally omit object locations, upload metadata and bearer
// credentials, which are issued only by the authenticated media edge.
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_ANIMATED_IMAGE = 2;
  MEDIA_KIND_VIDEO = 3;
  MEDIA_KIND_AUDIO = 4;
  MEDIA_KIND_FILE = 5;
}

message MediaPresentation {
  string media_id = 1;
  MediaKind kind = 2;
  string content_type = 3;
  int64 byte_count = 4;
}

// Acceptance proves only the atomic room-shard write. It does not prove that a
// recipient is online, synchronized, or has displayed the message.
message MessageAccepted {
  string message_id = 1;
  string room_id = 2;
  uint64 room_sequence = 3;
  int64 server_created_at_ms = 4;
  // A retry may happen after content was edited or erased. ACK never echoes
  // content, references, links or presentation facts; use authorized sync/read.
  reserved 5 to 10;
  reserved "media_ids", "mentioned_user_ids", "mentions_everyone",
           "media_presentations", "entities", "reply_to_message_id";
}

// The initial gateway-exposed moderation action is explicit message redaction.
// It is separate from author withdrawal and carries only a bounded policy code,
// never report text or message content.


// Owner/admin moderation command. The authenticated gateway identity is the
// actor; reason_code is an opaque bounded policy label, not report text.


message MemberMuted {
  string room_id = 1;
  string target_user_id = 2;
  int64 mute_until_ms = 3;
  uint64 room_sequence = 4;
  int64 server_created_at_ms = 5;
}

// This is deliberately not ChangeRoomMembership(action=REMOVE). It records a
// bounded moderation reason and is replayed from the moderation operation
// ledger, while still producing the canonical membership_changed room event.


message MemberRemovedByModerator {
  string room_id = 1;
  string target_user_id = 2;
  uint64 membership_revision = 3;
  uint64 room_sequence = 4;
  int64 server_created_at_ms = 5;
}

enum MembershipChangeAction {
  MEMBERSHIP_CHANGE_ACTION_UNSPECIFIED = 0;
  MEMBERSHIP_CHANGE_ACTION_ADD = 1;
  MEMBERSHIP_CHANGE_ACTION_REMOVE = 2;
}

// `operation_id` is durable client intent and remains stable across reconnects.
// `expected_membership_revision` fences stale administrative actions.


message MembershipChanged {
  string room_id = 1;
  string target_user_id = 2;
  MembershipChangeAction action = 3;
  uint64 membership_revision = 4;
  uint64 room_sequence = 5;
  int64 server_created_at_ms = 6;
}

// A withdrawal preserves the immutable message identity and room ordering,
// while turning its visible state into a revision-fenced tombstone.


message MessageWithdrawn {
  string room_id = 1;
  string message_id = 2;
  uint64 message_revision = 3;
  uint64 room_sequence = 4;
  int64 server_created_at_ms = 5;
}

enum MessageReactionAction {
  MESSAGE_REACTION_ACTION_UNSPECIFIED = 0;
  MESSAGE_REACTION_ACTION_ADD = 1;
  MESSAGE_REACTION_ACTION_REMOVE = 2;
}

// Reaction operations are stable client intent.  Reactions are a set keyed by
// message, actor, and normalized reaction value; they do not mutate text.


message MessageReactionChanged {
  string room_id = 1;
  string message_id = 2;
  string actor_user_id = 3;
  string reaction = 4;
  MessageReactionAction action = 5;
  uint64 room_sequence = 6;
  int64 server_created_at_ms = 7;
}

// Edits are author-only, revision-fenced mutations. `operation_id` is stable
// across retries and a concurrent withdrawal rejects the edit.


message MessageEdited {
  string room_id = 1;
  string message_id = 2;
  string text = 3;
  uint64 message_revision = 4;
  uint64 room_sequence = 5;
  int64 server_created_at_ms = 6;
}

// Human-viewing state. This does not acknowledge sync delivery and may only
// move the caller's room watermark forward.
message RecordReadReceipt {
  string room_id = 1;
  string operation_id = 2;
  uint64 read_through_room_sequence = 3;
}

message ReadReceiptRecorded {
  string room_id = 1;
  string user_id = 2;
  uint64 read_through_room_sequence = 3;
  int64 recorded_at_ms = 4;
}

// Opens the unique two-user room. Opening a room does not bypass the
// recipient's stranger-message setting; that policy is enforced when a new
// message is accepted.




// Group membership is collected in bounded pages, then frozen and committed
// under one durable operation ID. The room's immutable delivery mode is
// derived only from that frozen audience by the server. No roster is ever
// returned by this protocol path; use ListRoomMembers after creation.










// Cancels only a mutable staging draft. The operation is idempotent if the
// draft was already removed by expiry or an earlier cancellation; a frozen
// draft must continue through finalize so its room idempotency boundary stays
// unambiguous.




enum GroupCapacityClass {
  GROUP_CAPACITY_CLASS_UNSPECIFIED = 0;
  GROUP_CAPACITY_CLASS_STANDARD = 1;
  GROUP_CAPACITY_CLASS_LARGE = 2;
}

// A read-only, seek-paginated directory.  Member lists are never attached to
// room-created or membership fan-out events, because a large roster would be
// replicated once per recipient.  The authenticated caller must be an active
// member; clients treat `next_cursor` as opaque.
message ListRoomMembers {
  string room_id = 1;
  string cursor = 2;
  uint32 page_size = 3;
}

enum RoomMembershipRole {
  ROOM_MEMBERSHIP_ROLE_UNSPECIFIED = 0;
  ROOM_MEMBERSHIP_ROLE_OWNER = 1;
  ROOM_MEMBERSHIP_ROLE_ADMIN = 2;
  ROOM_MEMBERSHIP_ROLE_MEMBER = 3;
}

message RoomMember {
  string user_id = 1;
  RoomMembershipRole role = 2;
  // Directory facts do not grant permission to display profile content.
  // Visible rows resolve names/avatars through profile-presentations/batch.
  reserved 3, 4, 5;
  reserved "public_handle", "display_name", "account_kind";
}

message RoomMembersPage {
  string room_id = 1;
  uint64 membership_revision = 2;
  repeated RoomMember members = 3;
  string next_cursor = 4;
  RoomMembershipRole actor_role = 5;
}

// 会话列表的读模型：服务端聚合、有界分页，单聊与群聊返回同一种结构。
//
// 它是列表视图的唯一数据来源，也是"已发送不等于已送达"的落地方式：推送只是加速，
// 客户端重新连上后靠这里的未读数与房间游标恢复。页内每一行的未读数是精确值，
// 跨全部房间的总角标才允许滞后。
//
// 客户端只把 `cursor` 当作不透明字符串回传；它编码排序键
// (last_event_at, room_id)，与房间序号、个人时间线序号都无关。
// Recovery directory order is stable room identity, never recent activity.
// The authenticated connection determines the user; no caller-selected user ID.
message UserRoomDirectoryList {
  string cursor = 1;
  uint32 page_size = 2;
}

message UserRoomDirectoryEntry {
  string room_id = 1;
  string room_kind = 2;
  uint64 viewer_membership_revision = 3;
  uint64 owner_epoch = 4;
}

message UserRoomDirectoryPage {
  repeated UserRoomDirectoryEntry rooms = 1;
  // Empty rooms may still have a next cursor when candidates were filtered.
  string next_cursor = 2;
  string topology_generation = 3;
}

message RoomSyncStateBatch {
  repeated string room_ids = 1;
}

message RoomSyncState {
  string room_id = 1;
  uint64 owner_epoch = 2;
  uint64 viewer_membership_revision = 3;
  uint64 head = 4;
  uint64 trimmed_through = 5;
  uint64 read_through = 6;
  uint64 latest_own_message_sequence = 7;
  // Must equal head - max(read_through, latest_own_message_sequence).
  uint64 unread_count = 8;
}

message RoomSyncStateUnavailable {}

message RoomSyncStateRetry {
  uint32 retry_after_seconds = 1;
}

message RoomSyncStateResult {
  string room_id = 1;
  oneof result {
    RoomSyncState state = 2;
    // Does not distinguish a nonexistent room from one lacking authorization.
    RoomSyncStateUnavailable unavailable = 3;
    RoomSyncStateRetry retry = 4;
  }
}

message RoomSyncStateBatchResult {
  // Exactly one result for each distinct requested room; no silent omissions.
  repeated RoomSyncStateResult rooms = 1;
}

message AccountRoomChangesStart {}

message AccountRoomChangesReady {
  string connection_epoch = 1;
}

message AccountRoomResyncRequired {
  string connection_epoch = 1;
}

// Groups retain one ordered room log. The caller must be an active member now
// and must also have been eligible at each event's committed membership
// revision; leaving a room therefore revokes future reads without exposing
// events from before a later re-join. For standard-fan-out groups this endpoint
// is foreground preview only, never a replacement for personal sync ACKs.
message GroupEventPull {
  string room_id = 1;
  uint64 after_room_sequence = 2;
  uint32 page_size = 3;
}

// Protocol 27 message.edited payloads include replacement schema 1: accepted
// event identity, accepted membership revision, and complete authorized state.
// Only this explicit contract permits content revision gaps; legacy text deltas
// still require the preceding revision. Both personal and room feeds preserve it.
message GroupEvent {
  string source_event_id = 1;
  uint64 room_sequence = 2;
  string projection_kind = 3;
  bytes payload = 4;
}

message GroupEventPage {
  string room_id = 1;
  repeated GroupEvent events = 2;
  // Authenticated scanned-through boundary, including events invisible to this reader.
  // It is at least the last returned sequence and may advance on an empty page.
  // Missing authority or corrupt payloads must fail the page, never be skipped.
  // If has_more is true, this boundary must advance beyond the request cursor.
  uint64 next_room_sequence = 3;
  bool has_more = 4;
  // 已裁剪的历史下界：该序号之前的事件已按保留窗口移除，不再可恢复。
  // 客户端游标低于它时必须把该房间标记为"历史不完整"，并从这个下界继续拉取；
  // 0 表示该房间从未裁剪。静默少几条是明确禁止的行为。
  uint64 log_trimmed_through_room_sequence = 5;
}

// A foreground client subscribes only while a group detail view is visible.
// `after_room_sequence` is advisory and lets the server return a useful
// waterline; it never replaces Hybrid cursor pull or standard personal-sync
// acknowledgement.
message GroupEventSubscribe {
  string room_id = 1;
  uint64 after_room_sequence = 2;
  // Retired author-view nonce; author presentation now starts independently.
  reserved 3;
}

message GroupEventSubscribed {
  string room_id = 1;
  uint64 high_watermark = 2;
  // Authorization epoch captured by the same durable membership check that
  // admitted this foreground subscription. A live group payload is usable
  // only when its committed membership revision is exactly equal to this
  // value; otherwise the server sends a metadata wake and the client pulls
  // the durable room log.
  uint64 membership_revision = 3;
  // Retired author-view echo.
  reserved 4;
}

// request_id = 0; JSON follows the validated IMV2Core contract (at most 32 KiB).
// The complete uncompressed envelope/frame has its own transport budget.
message AuthorPresentationDelta { bytes payload = 1; }

// Full lookup identity. False booleans and absent contexts are invalid.
message ProfilePresentationKey {
  string user_id = 1;
  oneof context {
    bool relationship = 2;
    bool direct_conversation = 3;
    string room_id = 4;
    string group_join_review_room_id = 5;
  }
}

// Independent connection-local start. It grants no profile or room authority.
message AuthorPresentationStart {
  string stream_id = 1;
  string view_id = 2;
  repeated string message_room_ids = 3;
}

// Confirms only retained keys from one delta, never intervening sequences.
message AuthorPresentationReceipt {
  string stream_id = 1;
  string view_id = 2;
  uint64 sequence = 3;
  repeated ProfilePresentationKey keys = 4;
  optional uint32 minimum_remaining_milliseconds = 5;
}

// Complete replacement for this connection view; at most 128 full keys.
message AuthorPresentationInterests {
  string stream_id = 1;
  string view_id = 2;
  uint64 sequence = 3;
  repeated ProfilePresentationKey keys = 4;
}

// Connection-local cleanup, independent of room event subscriptions.
message AuthorPresentationEnd {
  string stream_id = 1;
  string view_id = 2;
}
message AuthorPresentationEnded {
  string stream_id = 1;
  string view_id = 2;
}

message GroupEventUnsubscribe {
  string room_id = 1;
}

message GroupEventAvailable {
  string room_id = 1;
  // Known committed head; optional bodies may end below this watermark.
  // It never advances the applied cursor without contiguous validated bodies.
  uint64 high_watermark = 2;
  // Optional acceleration payload for a plain room-log event. Its absence
  // retains the original metadata-only contract. Group payload publication
  // is additionally fenced by the subscription's membership revision on the
  // server. Clients must accept it only when it is the next contiguous
  // cursor event; otherwise they use GroupEventPull for durable recovery.
  string source_event_id = 3;
  uint64 room_sequence = 4;
  string projection_kind = 5;
  bytes event_payload = 6;
  // Ordered, encode-once foreground batch for a Hybrid group. The server
  // routes the batch only to subscriptions authorized at the exact committed
  // membership revision shared by every entry. Clients skip duplicates,
  // apply only a contiguous prefix, then cursor-pull on any gap.
  repeated GroupEvent live_events = 7;
}

enum StrangerMessagePermission {
  STRANGER_MESSAGE_PERMISSION_UNSPECIFIED = 0;
  STRANGER_MESSAGE_PERMISSION_ALLOW = 1;
  STRANGER_MESSAGE_PERMISSION_DENY = 2;
}

// Device-independent recipient privacy preference. It controls only new
// messages from non-friends before the recipient has replied in the direct
// room; block policy always takes precedence.


message StrangerMessagePermissionSet {
  StrangerMessagePermission permission = 1;
  int64 updated_at_ms = 2;
}

enum UserAddPermission {
  USER_ADD_PERMISSION_UNSPECIFIED = 0;
  USER_ADD_PERMISSION_ALLOW = 1;
  USER_ADD_PERMISSION_DENY = 2;
}

// Device-independent privacy preference for incoming relationship requests.
// Rejections intentionally use the generic forbidden response so callers do
// not learn whether this setting, a block, or another policy caused it.


message UserAddPermissionSet {
  UserAddPermission permission = 1;
  int64 updated_at_ms = 2;
}

// Receipt sharing affects disclosure only; the server still accepts a
// member's local viewing watermark while sharing is disabled. For direct
// rooms, visibility is reciprocal and requires both peers to allow it.


message ReadReceiptPreferencesSet {
  bool allows_direct_read_receipts = 1;
  bool allows_group_read_receipts = 2;
  int64 updated_at_ms = 3;
}

// Group read details are queried on demand instead of broadcasting a receipt
// to every member. A message ID, rather than an arbitrary room sequence, binds
// authorization to the message's frozen membership revision. The cursor is
// opaque and may only be reused for this exact room/message query.
message ListReadReceiptReaders {
  string room_id = 1;
  string message_id = 2;
  string cursor = 3;
  uint32 page_size = 4;
}

message ReadReceiptReader {
  string user_id = 1;
  // Receipt disclosure and profile presentation have separate authorization.
  // The page discloses reader IDs; names/avatars need a current room lease.
  reserved 2, 3, 4;
  reserved "public_handle", "display_name", "account_kind";
}

message ReadReceiptReadersPage {
  string room_id = 1;
  string message_id = 2;
  repeated ReadReceiptReader readers = 3;
  string next_cursor = 4;
}

enum RelationshipAction {
  RELATIONSHIP_ACTION_UNSPECIFIED = 0;
  RELATIONSHIP_ACTION_REQUEST = 1;
  RELATIONSHIP_ACTION_ACCEPT = 2;
  RELATIONSHIP_ACTION_REJECT = 3;
  RELATIONSHIP_ACTION_REMOVE = 4;
}

enum RelationshipState {
  RELATIONSHIP_STATE_UNSPECIFIED = 0;
  RELATIONSHIP_STATE_NONE = 1;
  RELATIONSHIP_STATE_PENDING = 2;
  RELATIONSHIP_STATE_ACCEPTED = 3;
}

// The authenticated user is the actor. While a request is pending only its
// recipient may accept or reject it; either participant may remove it.


message RelationshipChanged {
  string target_user_id = 1;
  RelationshipAction action = 2;
  RelationshipState resulting_state = 3;
  int64 updated_at_ms = 4;
}

enum UserBlockAction {
  USER_BLOCK_ACTION_UNSPECIFIED = 0;
  USER_BLOCK_ACTION_BLOCK = 1;
  USER_BLOCK_ACTION_UNBLOCK = 2;
}

// Block state is private to the authenticated user. The server does not send
// a target-side block event or reveal whether a relationship failure is due to
// a block held by either user.


message UserBlockChanged {
  string target_user_id = 1;
  UserBlockAction action = 2;
  bool is_blocked = 3;
  int64 updated_at_ms = 4;
}

message SyncPull {
  string sync_token = 1;
  uint32 max_records = 2;
  // Authenticated device requests a full personal baseline even above the
  // retention floor. Existing pending resets are resumed, not duplicated.
  bool require_snapshot = 3;
}

message SyncRecord {
  uint64 user_sync_sequence = 1;
  string source_event_id = 2;
  string projection_kind = 3;
  bytes payload = 4;
}

message SyncBatch {
  uint64 generation = 1;
  repeated SyncRecord records = 2;
  string next_sync_token = 3;
  string sync_receipt = 4;
  bool has_more = 5;
  string capability_profile = 6;
}

message SyncAck {
  uint64 generation = 1;
  uint64 highest_contiguous_sequence = 2;
  string sync_receipt = 3;
}

message ResetRequired {
  string snapshot_id = 1;
  uint64 generation = 2;
  uint64 base_user_sync_sequence = 3;
  int64 expires_at_ms = 4;
}

message SnapshotAck {
  // Commits the server generation before the client atomically activates its
  // durable shadow projection. Exact replay must succeed after that commit,
  // including while a later generation is already being prepared.
  string snapshot_id = 1;
  uint64 generation = 2;
  uint64 base_user_sync_sequence = 3;
  string snapshot_receipt = 4;
}

// While a durable artifact is being built, SyncPull returns RESET_PREPARING.
// No partial descriptor or page is exposed.
message SyncSnapshot {
  string snapshot_id = 1;
  uint64 generation = 2;
}

message SnapshotManifest {
  // The client persists this descriptor together with its shadow import so a
  // crash after server ACK does not need a stale-token pull or page refetch.
  string snapshot_id = 1;
  uint64 generation = 2;
  uint64 base_user_sync_sequence = 3;
  string root_digest = 4;
  uint32 schema_version = 5;
  string capability_profile = 6;
  uint32 page_count = 7;
  uint64 total_items = 8;
  uint64 total_bytes = 9;
  string next_sync_token = 10;
  string sync_receipt = 11;
  int64 expires_at_ms = 12;
}

message SnapshotPagePull {
  string snapshot_id = 1;
  uint64 generation = 2;
  string root_digest = 3;
  uint32 page_index = 4;
}

message SnapshotPage {
  string snapshot_id = 1;
  uint64 generation = 2;
  string root_digest = 3;
  uint32 page_index = 4;
  string first_projection_kind = 5;
  string first_entity_key = 6;
  string last_projection_kind = 7;
  string last_entity_key = 8;
  uint32 item_count = 9;
  string page_digest = 10;
  bytes payload = 11;
}

// An asynchronous availability hint always uses request_id = 0. It contains
// no message payload and never advances a client cursor.
message SyncAvailable {
  uint64 event_id = 1;
  uint64 high_watermark = 2;
}

message Error {
  string code = 1;
  bool retryable = 2;
  uint32 retry_after_seconds = 3;
  // Present for stale entity mutations such as membership changes.
  uint64 current_revision = 4;
}

// Display-only snapshots; receiving one must never advance the room log cursor.
message RoomLatestVisibleBatch {
  repeated string room_ids = 1;
}

message RoomLatestVisibleMessage {
  string message_id = 1;
  string sender_user_id = 2;
  uint64 room_sequence = 3;
  uint64 message_revision = 4;
  string preview = 5;
  uint32 media_count = 6;
  int64 created_at_ms = 7;
}

message RoomLatestVisibleSnapshot {
  uint64 owner_epoch = 1;
  uint64 viewer_membership_revision = 2;
  uint64 head = 3;
  // Absent means no currently visible effective message at this observation.
  RoomLatestVisibleMessage latest = 4;
}

message RoomLatestVisibleResult {
  string room_id = 1;
  oneof result {
    RoomLatestVisibleSnapshot snapshot = 2;
    RoomSyncStateUnavailable unavailable = 3;
    RoomSyncStateRetry retry = 4;
  }
}

message RoomLatestVisibleBatchResult {
  // Every requested ID has an explicit result, including deferred budget items.
  repeated RoomLatestVisibleResult rooms = 1;
}

// Connection-local privacy ceiling, reapplied before authenticated registration.
message PresencePublicationControl {
  enum Mode { UNSPECIFIED = 0; SUPPRESSED = 1; ALLOW_WHEN_AUTHORIZED = 2; }
  Mode mode = 1;
}
message PresencePublicationControlled { PresencePublicationControl.Mode mode = 1; }

// Connection-local revision orders coverage transitions, never authorization.
// READY is sent only after the matching subscription and fresh-head barrier.
message RealtimeCoverage {
  enum Scope { SCOPE_UNSPECIFIED = 0; ACCOUNT = 1; ROOM = 2; DIRECTORY = 3; PRESENCE = 4; TYPING = 5; }
  enum State { STATE_UNSPECIFIED = 0; RECOVERING = 1; READY = 2; ENDED = 3; }
  enum Reason { REASON_UNSPECIFIED = 0; INSTALLING = 1; COVERAGE_LOST = 2; DEPENDENCY_UNAVAILABLE = 3; CANCELLED = 4; }
  Scope scope = 1;
  string scope_id = 2;
  uint64 revision = 3;
  State state = 4;
  Reason reason = 5;
  uint64 scope_generation = 6;
  // Account/room barrier only. Directory channel uses connection_epoch instead.
  uint64 high_watermark = 7;
  string connection_epoch = 8;
}
