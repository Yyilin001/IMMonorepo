syntax = "proto3";

package im.realtime.v1;

option swift_prefix = "IMRT";
option java_package = "com.xmtx.imclientkit.generated.im.realtime.v1";
option java_multiple_files = true;

message Packet {
  optional string request_id = 1;
  int64 timestamp_ms = 2;
  uint32 protocol_version = 3;

  oneof body {
    AuthRequest auth = 10;
    AuthAccepted auth_ok = 11;
    AuthError auth_error = 12;
    Heartbeat heartbeat = 20;
    Heartbeat heartbeat_ack = 21;
    SendMessageCommand send_message = 30;
    Ack ack = 31;
    ChatDomainEvent domain_event = 40;
    MessageStreamSignal stream_signal = 41;
    Kick kick = 50;
  }
}

message AuthRequest {
  string access_token = 1;
  optional string device_id = 2;
  optional string device_name = 3;
  optional string platform = 4;
  optional string app_version = 5;
}

message AuthAccepted {
  string connection_id = 1;
  string user_id = 2;
  string session_id = 3;
  uint32 heartbeat_interval_seconds = 4;
  int64 server_time_ms = 5;
}

message AuthError {
  string code = 1;
  string message = 2;
}

message Heartbeat {
  int32 sequence = 1;
}

message Ack {
  string message_id = 1;
  optional string conversation_id = 2;
  string status = 3;
}

message SendMessageCommand {
  optional string client_message_id = 1;
  string conversation_id = 3;
  MessageContent content = 7;
}

message ChatDomainEvent {
  string event_id = 1;
  string event_type = 2;
  string aggregate_type = 3;
  string aggregate_id = 4;
  optional uint64 aggregate_sequence = 5;
  int64 occurred_at_ms = 6;
  optional string actor_user_id = 7;

  optional ConversationSummary conversation = 8;
  optional TimelineNotice timeline_notice = 9;
  optional uint64 owner_cursor = 60;
  optional uint64 owner_aggregate_sequence = 61;
  bool requires_timeline_notice = 62;

  oneof body {
    MessageCreatedEvent message_created = 10;
    MessageEditedEvent message_edited = 11;
    MessageRevokedEvent message_revoked = 12;
    MessageVisibilityChangedEvent message_visibility_changed = 13;
    MessageFavoriteChangedEvent message_favorite_changed = 14;
    MessageStreamEvent message_stream_started = 20;
    MessageStreamEvent message_stream_completed = 22;
    MessageStreamEvent message_stream_failed = 23;
    MessageStreamEvent message_stream_cancelled = 24;
    ConversationChangedEvent conversation_created = 30;
    ConversationChangedEvent conversation_updated = 31;
    ConversationRemovedForSelfEvent conversation_removed_for_self = 32;
    ConversationChangedEvent conversation_settings_changed = 33;
    ConversationVisibilityChangedEvent conversation_visibility_changed = 34;
    MemberChangedEvent member_added = 40;
    MemberChangedEvent member_removed = 41;
    MemberChangedEvent member_role_updated = 42;
    ContactChangedEvent contact_request_created = 50;
    ContactChangedEvent contact_request_accepted = 51;
    ContactChangedEvent contact_request_updated = 52;
  }
}

message MessageCreatedEvent {
  ConversationMessage message = 1;
  optional string client_message_id = 2;
}

message MessageEditedEvent {
  string message_id = 1;
  RichTextContent body = 2;
  int64 edited_at_ms = 3;
  optional ConversationMessage message = 4;
}

message MessageRevokedEvent {
  string message_id = 1;
  int64 revoked_at_ms = 2;
  optional string revoked_by_user_id = 3;
  optional ConversationMessage message = 4;
}

message MessageVisibilityChangedEvent {
  repeated string message_ids = 1;
  optional ConversationMessage message = 2;
  optional string visibility_action = 3;
}

message MessageFavoriteChangedEvent {
  string message_id = 1;
  bool is_favorited = 2;
}

message MessageStreamEvent {
  MessageStreamPayload stream = 1;
  optional ConversationMessage message = 2;
}

message MessageStreamSignal {
  MessageStreamPayload stream = 1;
  optional ConversationMessage message = 2;
}

message ConversationChangedEvent {}

message ConversationRemovedForSelfEvent {}

message ConversationVisibilityChangedEvent {
  string visibility_action = 1;
  repeated string message_ids = 2;
}

message MemberChangedEvent {
  repeated string member_user_ids = 1;
}

message ContactChangedEvent {
  optional ContactRequest request = 1;
  optional Contact contact = 2;
  optional string contact_user_id = 3;
}

message TimelineNotice {
  string id = 1;
  string conversation_id = 2;
  optional uint64 timeline_sequence = 3;
  string event_type = 4;
  optional string actor_user_id = 5;
  repeated string target_user_ids = 6;
  string notice_kind = 7;
  map<string, string> params = 8;
  string fallback_text = 9;
  int64 created_at_ms = 10;
}

message Kick {
  string reason = 1;
  string message = 2;
}

message MessageStreamPayload {
  string stream_id = 1;
  string message_id = 2;
  string conversation_id = 3;
  int32 chunk_index = 4;
  optional string delta_text = 5;
  int32 partial_text_length = 6;
  string state = 7;
  int64 server_timestamp_ms = 8;
}

message ConversationSummary {
  string id = 1;
  optional string title = 2;
  string kind = 3;
  optional string direct_messaging_state = 4;
  optional DirectPeer direct_peer = 5;
  optional string notice = 6;
  optional string avatar_preset = 7;
  bool mute_all = 8;
  int32 member_count = 9;
  repeated string member_user_ids = 10;
  optional MessagePreview last_message = 11;
  optional uint64 last_read_sequence = 12;
  int32 unread_count = 13;
  bool is_pinned = 14;
  optional int64 pinned_at_ms = 15;
  bool is_muted = 16;
  optional int64 created_at_ms = 17;
  int64 updated_at_ms = 18;
}

message DirectPeer {
  string id = 1;
  string email = 2;
  optional string display_name = 3;
  optional string avatar_preset = 4;
}

message MessagePreview {
  string id = 1;
  string sender_user_id = 2;
  optional uint64 server_sequence = 3;
  MessageContent content = 4;
  MessageDerivedState derived_state = 5;
  optional int64 created_at_ms = 6;
  optional uint64 timeline_sequence = 7;
}

message ConversationMessage {
  string id = 1;
  string conversation_id = 2;
  string sender_user_id = 3;
  optional string client_message_id = 4;
  optional uint64 server_sequence = 5;
  MessageContent content = 6;
  MessageDerivedState derived_state = 7;
  optional int64 created_at_ms = 8;
  optional uint64 timeline_sequence = 9;
}

message MessageContent {
  oneof body {
    RichTextContent rich_text = 1;
    ReplyContent reply = 2;
    MediaAsset image = 5;
    MediaAsset audio = 6;
    MediaAsset file = 7;
  }
}

message RichTextContent {
  string text = 1;
  repeated TextEntity entities = 2;
}

message ReplyContent {
  ReplyReference reference = 1;
  RichTextContent body = 2;
}

message TextRange {
  int32 location = 1;
  int32 length = 2;
}

message TextEntity {
  TextRange range = 1;

  oneof body {
    LinkEntity link = 10;
    MentionEntity mention = 11;
    HashtagEntity hashtag = 12;
    InlineCodeEntity inline_code = 13;
  }
}

message LinkEntity {
  string url = 1;
}

message MentionEntity {
  string user_id = 1;
}

message HashtagEntity {
  string value = 1;
}

message InlineCodeEntity {}

message ReplyReference {
  string message_id = 1;
  optional string sender_user_id = 2;
  string preview_text = 3;
}

message MediaAsset {
  string asset_id = 1;
  string kind = 2;
  string mime_type = 3;
  int64 byte_size = 4;
  string filename = 5;
  optional int32 width = 6;
  optional int32 height = 7;
  optional int32 duration_millis = 8;
  optional string preview_asset_id = 9;
}

message MessageDerivedState {
  string recall_state = 1;
  repeated MessageEdit edits = 2;
  repeated MessageReaction reactions = 3;
  optional MessageStreamState stream_state = 4;
}

message MessageEdit {
  optional int64 edited_at_ms = 1;
  RichTextContent body = 2;
}

message MessageReaction {
  string emoji = 1;
  repeated string actor_user_ids = 2;
}

message MessageStreamState {
  string stream_id = 1;
  string state = 2;
  int32 last_chunk_index = 3;
  string partial_text = 4;
  optional string error_code = 5;
  optional string error_message = 6;
  int64 updated_at_ms = 7;
  bool is_ai_generated = 8;
}

message Contact {
  string id = 1;
  string email = 2;
  optional string display_name = 3;
  optional string avatar_preset = 4;
  optional string remark = 5;
  optional int64 created_at_ms = 6;
}

message ContactRequest {
  string id = 1;
  User requester = 2;
  User addressee = 3;
  string status = 4;
  optional string message = 5;
  optional string requester_remark = 6;
  optional string addressee_remark = 7;
  optional int64 created_at_ms = 8;
  optional int64 updated_at_ms = 9;
  optional int64 responded_at_ms = 10;
}

message User {
  string id = 1;
  string email = 2;
  optional string display_name = 3;
  optional string avatar_preset = 4;
}
