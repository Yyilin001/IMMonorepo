syntax = "proto3";
package im.actor.v1;

// Infrequent placement control records. They never carry message bodies.
message PlacementOwner { HostIdentity host = 1; uint64 epoch = 2; }
message PlacementTransfer { bytes id = 1; HostIdentity successor = 2; }
message PlacementSlot { PlacementOwner owner = 1; PlacementTransfer transfer = 2; bool retired = 3; }
message PlacementHostRegistration { HostIdentity host = 1; bool retired = 2; }
message PlacementSnapshot {
  bytes cluster_id = 1; uint64 revision = 2; repeated PlacementSlot slots = 3;
  repeated PlacementHostRegistration hosts = 4;
}
message PlacementCommand {
  enum Kind { UNSPECIFIED = 0; BEGIN_TRANSFER = 1; COMPLETE_TRANSFER = 2; CANCEL_TRANSFER = 3; RETIRE_HOST = 4; REGISTER_HOST = 5; }
  Kind kind = 1;
  uint32 partition = 2;
  PlacementOwner expected = 3;
  PlacementTransfer transfer = 4;
  bytes transfer_id = 5;
  HostIdentity previous_host = 6;
  HostIdentity successor_host = 7;
}
// Fixed-three-voter state lives on stable local storage, independently of rooms.
// A bootstrap or CAS command applied only from the committed Raft prefix.
message PlacementRaftOperation {
  bytes bootstrap_snapshot = 1;
  bytes request_id = 2;
  bytes expected_snapshot = 3;
  bytes command = 4;
  uint64 origin_revision = 5;
}
// A compact application checkpoint retains successful command identities.
// Replaying these commands from genesis reconstructs historical ACK results.
message PlacementRaftCheckpointReceipt { bytes request_id = 1; bytes command = 2; uint64 revision = 3; uint64 origin_revision = 4; }
message PlacementRaftApplicationCheckpoint {
  bytes group_id = 1; uint64 applied_index = 2; bytes genesis_snapshot = 3;
  repeated PlacementRaftCheckpointReceipt receipts = 4;
  bytes bootstrap_digest = 5;
  repeated PlacementRaftCheckpointReceipt pinned_receipts = 6;
}
message PlacementRaftEntry { uint64 term = 1; bytes payload = 2; }
message PlacementRaftState {
  bytes group_id = 1; repeated string voter_ids = 2; uint64 current_term = 3;
  optional string voted_for = 4; repeated PlacementRaftEntry entries = 5; uint64 commit_index = 6;
  string local_voter_id = 7;
  uint64 snapshot_index = 8; uint64 snapshot_term = 9; bytes application_checkpoint = 10;
}
message PlacementRaftVoteRequest {
  bytes group_id = 1; string candidate = 2; uint64 term = 3; uint64 last_index = 4; uint64 last_term = 5;
}
message PlacementRaftVoteReply { bytes group_id = 1; uint64 term = 2; bool granted = 3; }
message PlacementRaftAppendRequest {
  bytes group_id = 1; string leader = 2; uint64 term = 3; uint64 previous_index = 4;
  uint64 previous_term = 5; repeated PlacementRaftEntry entries = 6;
  uint64 leader_commit = 7; bytes read_id = 8;
}
message PlacementRaftAppendReply {
  bytes group_id = 1; uint64 term = 2; bool accepted = 3; uint64 matched_index = 4; bytes read_id = 5;
}
// Portable lifecycle evidence signed only after native physical completion.
message PlacementDrainCertificate {
  enum Kind { UNSPECIFIED = 0; PARTITION = 1; HOST = 2; EXCLUDED_HOST = 3; }
  Kind kind = 1; bytes group_id = 2; string shard_id = 3; HostIdentity host = 4;
  uint32 partition = 5; uint64 epoch = 6; bytes transfer_id = 7;
  HostIdentity registration_previous = 8; bytes registration_request_id = 9;
  bytes exclusion_request_id = 10;
}
message PlacementSignedCertificate { string signer_id = 1; bytes body = 2; bytes signature = 3; }
message PlacementRaftWriteRequest { bytes operation = 1; PlacementSignedCertificate evidence = 2; }
message PlacementRaftWriteReply {
  bytes group_id = 1; bytes snapshot = 2; string leader_hint = 3; uint32 rejection = 4;
}
message PlacementRaftReadRequest { bytes group_id = 1; bool include_archive_usage = 2; }
message PlacementRaftArchiveUsage {
  uint64 receipts = 1; uint64 bytes = 2;
  uint64 reserved_receipts = 3; uint64 reserved_bytes = 4;
}
// Local supervisor intent, never a process-exclusion certificate.
message RoomHostRecoveryOperation {
  string host_id = 1; bytes incarnation_id = 2; bytes operation_id = 3; bool completed = 4;
}
message RoomHostRecoveryJournal {
  uint32 version = 1; string supervisor_id = 2; repeated string host_ids = 3;
  repeated RoomHostRecoveryOperation operations = 4;
}
message RoomHostRecoveryJournalFile { bytes journal = 1; bytes sha256 = 2; }
message DockerRoomHostBinding {
  string host_id = 1; bytes incarnation_id = 2; string container_id = 3; string started_at = 4;
}
message DockerRoomHostInventory {
  uint32 version = 1; string supervisor_id = 2; string daemon_id = 3; string socket_path = 4;
  repeated string host_ids = 5; repeated DockerRoomHostBinding bindings = 6;
}
message DockerRoomHostInventoryFile { bytes inventory = 1; bytes sha256 = 2; }
message RoomHostStartupHello {
  string host_id = 1; bytes incarnation_id = 2; bytes launch_token = 3;
  string supervisor_id = 4; string service_id = 5; int64 process_id = 6;
}
message RoomHostStartupRelease { bytes hello_sha256 = 1; string supervisor_id = 2; }
message DockerRoomHostLaunch {
  uint32 version = 1; string supervisor_id = 2; string daemon_id = 3; string socket_path = 4;
  string host_id = 5; string service_id = 6; string gate_directory = 7;
  bytes launch_token = 8; bytes create_request = 9; string container_id = 10;
  string started_at = 11; bytes incarnation_id = 12; bool released = 13;
}
message DockerRoomHostLaunchFile { bytes launch = 1; bytes sha256 = 2; }
message PlacementRaftReadReply {
  bytes group_id = 1; bytes snapshot = 2; string leader_hint = 3;
  PlacementRaftArchiveUsage archive_usage = 4;
}
message PlacementRaftSnapshotChunk {
  bytes group_id = 1; string leader = 2; uint64 term = 3; bytes transfer_id = 4;
  uint64 snapshot_index = 5; uint64 snapshot_term = 6; bytes digest = 7;
  uint32 total_bytes = 8; uint32 offset = 9; bytes chunk = 10;
}
message PlacementRaftSnapshotReply {
  bytes group_id = 1; uint64 term = 2; bytes transfer_id = 3;
  uint64 snapshot_index = 4; bool accepted = 5; uint32 next_offset = 6; bool installed = 7;
}
message PlacementRaftRequest { oneof body { PlacementRaftVoteRequest vote = 1; PlacementRaftAppendRequest append = 2; PlacementRaftSnapshotChunk snapshot = 3; } }
message PlacementRaftReply { oneof body { PlacementRaftVoteReply vote = 1; PlacementRaftAppendReply append = 2; PlacementRaftSnapshotReply snapshot = 3; } }
message PlacementRaftFile { uint32 format = 1; bytes state = 2; bytes digest = 3; }
// Closed Swift Codable contracts carried as typed Protobuf values. No JSON
// text or base64 is embedded. Keys preserve the domain's CodingKeys; changing
// an enum case or key is an internal protocol change requiring joint rollout.
message Value {
  oneof kind {
    bool null_value = 1;
    bool bool_value = 2;
    sint64 signed_value = 3;
    uint64 unsigned_value = 4;
    double double_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    Object object_value = 8;
    Array array_value = 9;
  }
}
message Field { string name = 1; Value value = 2; }
message Object { repeated Field fields = 1; }
message Array { repeated Value values = 1; }

// The hot authenticated envelopes use fixed field numbers instead of named
// Codable fields. Domain bodies use HotRPCRequest/HotRPCResponse, decoded once.
message HostIdentity { string host_id = 1; bytes incarnation_id = 2; }
message AuthenticatedCall {
  sint64 version = 1;
  string service_id = 2;
  bytes caller_incarnation = 3;
  HostIdentity recipient = 4;
  bytes session_id = 5;
  uint64 sequence = 6;
  bytes attempt_id = 7;
  bytes trace_id = 8;
  uint64 remaining_budget_ms = 9;
  oneof principal { string user_id = 10; bool service = 11; }
  // One encoded HotRPCRequest body. Header serialization never walks the body.
  bytes request_body = 12;
}
message AuthenticatedReply {
  sint64 version = 1;
  HostIdentity host = 2;
  bytes session_id = 3;
  uint64 sequence = 4;
  bytes attempt_id = 5;
  bytes response_body = 6;
}

// Fixed hot contracts. cold_value is reserved for low-frequency operations;
// hot branches must never be emitted or accepted through that escape hatch.
message HotEmpty {}
message HotOwner { string shard_id = 1; sint64 epoch = 2; }
message HotActivation { string room_id = 1; HotOwner owner = 2; sint64 activation_epoch = 3; HostIdentity host = 4; }
message HotGateway { string node_id = 1; string service_id = 2; bytes incarnation_id = 3; }
message HotGatewayDescriptor { HotGateway identity = 1; bytes endpoint_reference = 2; string address = 3; sint64 port = 4; }
message HotFence { HotActivation activation = 1; bytes subscription_id = 2; uint64 generation = 3; uint64 baseline_sequence = 4; }
message HotMember { string user_id = 1; uint64 revision = 2; }
message HotMention { oneof target { string user_id = 1; bool everyone = 2; } }
message HotEntity { sint64 offset = 1; sint64 length = 2; string kind = 3; optional string link = 4; }
message HotSend {
  string room_id = 1; string sender_id = 2; string client_message_id = 3; string text = 4;
  repeated string media_ids = 5; repeated HotMention mentions = 6; repeated HotEntity entities = 7;
  optional string reply_message_id = 8; uint64 first_submission_deadline_ms = 9;
}
message HotSendIdentity { string account_id = 1; string room_id = 2; string client_message_id = 3; }
message HotFingerprint { uint32 version = 1; bytes digest = 2; }
message HotAccepted { string message_id = 1; uint64 room_sequence = 2; }
message HotSendReceipt {
  HotSendIdentity identity = 1; HotFingerprint fingerprint = 2; uint64 resolved_at_ms = 3;
  oneof outcome { HotAccepted accepted = 4; string rejected = 5; }
}
message HotRetry { HotSendIdentity identity = 1; HotFingerprint fingerprint = 2; string reason = 3; optional uint64 retry_after_ms = 4; }
message HotSendResult { oneof outcome { HotSendReceipt receipt = 1; HotRetry deferred = 2; HotEmpty unresolved = 3; HotEmpty fingerprint_conflict = 4; } }
message HotSubscriptionCommand {
  string room_id = 1; string user_id = 2; HotGatewayDescriptor gateway = 3;
  // 1 subscribe, 2 activate, 3 reset, 4 unsubscribe. Unrecognized kinds fail closed.
  uint32 kind = 4; HotFence fence = 5; uint64 member_revision = 6;
}
message HotDeliverySession { HostIdentity host = 1; HotGateway gateway = 2; uint64 generation = 3; }
message HotSubscriptionGrant { HotFence fence = 1; uint64 member_revision = 2; uint64 baseline = 3; HotDeliverySession session = 4; }
message HotSubscriptionResult { oneof outcome { HotSubscriptionGrant granted = 1; HotEmpty activated = 2; HotEmpty unsubscribed = 3; string failure = 4; } }
message HotLogPull { string room_id = 1; string user_id = 2; uint64 after_sequence = 3; sint64 page_size = 4; }
message HotLogSubscribe { string room_id = 1; string user_id = 2; }
message HotLogEntry { string event_id = 1; uint64 sequence = 2; string projection_kind = 3; bytes payload = 4; }
message HotLogPage { string room_id = 1; repeated HotLogEntry events = 2; uint64 next_sequence = 3; bool has_more = 4; uint64 trimmed_through = 5; }
message HotLogSubscription { string room_id = 1; uint64 high_watermark = 2; uint64 membership_revision = 3; }
message HotRoomRequest { oneof operation { HotSend send = 1; HotSubscriptionCommand subscription = 2; HotLogPull log_pull = 3; HotLogSubscribe log_subscribe = 4; bytes cold_value = 100; } }
message HotRoomResponse { oneof result { HotSendResult send = 1; HotSubscriptionResult subscription = 2; HotLogPage log_page = 3; HotLogSubscription log_subscription = 4; string log_failure = 5; bytes cold_value = 100; } }
message HotInvoke { HotActivation token = 1; HotRoomRequest request = 2; }
message HotReady { HotActivation token = 1; bytes physical_reference = 2; }
message HotRPCRequest { oneof operation { HotInvoke invoke = 1; HotActivation lookup = 2; bytes cold_value = 100; } }
message HotRPCResponse { oneof result { HotRoomResponse response = 1; HotReady ready = 2; bool completed = 4; HotEmpty acknowledged = 5; bytes cold_value = 100; } }

message HotEvent {
  string room_id = 1; uint64 high_watermark = 2; string event_id = 3; uint64 sequence = 4;
  string projection_kind = 5; bytes payload = 6; repeated string recipient_ids = 7;
  optional uint64 group_revision = 8; optional uint64 accepted_revision = 9; optional bytes excluded_connection = 10;
}
message HotMembers { repeated HotMember members = 1; }
message HotBaselinePage { sint64 index = 1; sint64 total = 2; repeated HotMember members = 3; }
message HotGrant { HotMember member = 1; uint64 baseline = 2; }
message HotEventMembers { HotEvent event = 1; repeated HotMember members = 2; }
message HotSubscriptionDelivery {
  HotFence fence = 1; uint64 delivery_sequence = 2; uint64 authorization_sequence = 3;
  oneof payload { HotMembers baseline = 4; HotBaselinePage baseline_page = 5; HotGrant grant = 6; HotEvent broadcast = 7; HotEventMembers event = 8; uint64 head = 9; HotEmpty invalidated = 10; HotMember revoke = 11; }
}
message HotDeliveryResult { oneof result { uint64 applied_through = 1; HotEmpty snapshot_required = 2; HotEmpty stale = 3; } }
message HotSubscriptionReceipt { HotFence fence = 1; HotDeliveryResult result = 2; }
message HotDeliveryBatch { repeated HotSubscriptionDelivery deliveries = 1; }
message HotDeliveryReceipts { repeated HotSubscriptionReceipt receipts = 1; }
message HotRealtimeHeader {
  string service_id = 1; sint64 version = 2; bytes caller_incarnation = 3; HotGateway recipient = 4;
  bytes session_id = 5; uint64 sequence = 6; bytes attempt_id = 7;
}
message HotSubscriptionCall { HotRealtimeHeader header = 1; string source_shard_id = 2; HotSubscriptionDelivery delivery = 3; }
message HotSubscriptionReply { HotRealtimeHeader header = 1; HotDeliveryResult result = 2; }
message HotSubscriptionBatchCall { HotRealtimeHeader header = 1; string source_shard_id = 2; HotDeliveryBatch batch = 3; }
message HotSubscriptionBatchReply { HotRealtimeHeader header = 1; HotDeliveryReceipts result = 2; }
message HotTopic { string kind = 1; string id = 2; HotOwner owner = 3; }
message HotRoomWake { string room_id = 1; uint64 watermark = 2; }
message HotUserSync { string user_id = 1; uint64 watermark = 2; }
message HotTyping { string room_id = 1; string user_id = 2; bool is_typing = 3; double expires = 4; bytes connection_id = 5; uint64 sequence = 6; }
message HotEvents { repeated HotEvent events = 1; }
message HotRealtimePayload { oneof payload { HotRoomWake room_wake = 1; HotEvents room_events = 2; HotUserSync user_sync = 3; string presence = 4; HotTyping typing = 5; } }
message HotRealtimeDelivery { HotTopic topic = 1; sint64 partition_id = 2; sint64 partition_epoch = 3; bytes session_id = 4; sint64 interest_generation = 5; bytes gateway_incarnation = 6; HotRealtimePayload payload = 7; }
message HotRealtimeBatch { bytes batch_id = 1; HotGateway recipient = 2; repeated HotRealtimeDelivery deliveries = 3; }
message HotRealtimeCall { HotRealtimeHeader header = 1; HotRealtimeBatch batch = 2; }
message HotRealtimeReply { HotRealtimeHeader header = 1; string acceptance = 2; }
message HotJournalSource { string source_id = 1; bytes incarnation_id = 2; sint64 partition_id = 3; }
message HotJournalFence {
  bytes publisher_incarnation = 1; sint64 source_epoch = 2; bytes source_token = 3; double source_expires = 4;
  sint64 routing_epoch = 5; bytes routing_token = 6; bytes session_id = 7; sint64 interest_generation = 8; bytes gateway_incarnation = 9;
}
message HotJournalAuthorization { string room_id = 1; uint64 owner_epoch = 2; uint64 permission_version = 3; uint64 control_version = 4; repeated HotMember viewers = 5; uint64 watermark = 6; }
message HotJournalHead { string room_id = 1; uint64 watermark = 2; uint64 owner_epoch = 3; uint64 control_version = 4; }
message HotJournalChange {
  uint32 kind = 1; HotJournalAuthorization authorization = 2; string subject_id = 3;
  uint64 watermark = 4; uint64 owner_epoch = 5; uint64 permission_version = 6; uint64 control_version = 7;
  optional bytes device_id = 8; optional string membership_room_id = 9;
}
message HotJournalEntry { sint64 sequence = 1; HotJournalChange change = 2; }
message HotJournalChanges { sint64 from_exclusive = 1; sint64 through_inclusive = 2; repeated HotJournalEntry entries = 3; }
message HotJournalSnapshot { sint64 cut = 1; repeated HotJournalAuthorization rooms = 2; }
message HotJournalHeads { repeated HotJournalHead heads = 1; }
message HotJournalBatch {
  bytes batch_id = 1; HotJournalSource source = 2; HotJournalFence fence = 3;
  oneof payload { sint64 baseline = 4; HotJournalChanges changes = 5; HotJournalSnapshot snapshot = 6; HotJournalHeads heads = 7; }
}
message HotJournalApplied { bytes batch_id = 1; HotJournalSource source = 2; HotJournalFence fence = 3; sint64 applied_through = 4; bool snapshot_installed = 5; }
message HotJournalResult { oneof result { HotJournalApplied applied = 1; HotJournalApplied heads_applied = 2; HotEmpty stale = 3; HotEmpty snapshot_required = 4; HotEmpty overloaded = 5; HotEmpty invalid = 6; } }
message HotJournalCall { HotRealtimeHeader header = 1; HotJournalBatch batch = 2; }
message HotJournalReply { HotRealtimeHeader header = 1; HotJournalResult result = 2; }
message HotShardToken { sint64 partition_id = 1; HotGateway host = 2; sint64 epoch = 3; bytes lease_token = 4; }
message HotPublish { HotShardToken token = 1; HotTopic topic = 2; HotRealtimePayload payload = 3; }
message HotShardCall { HotRealtimeHeader header = 1; oneof operation { HotPublish publish = 2; bytes cold_control = 100; } }
message HotShardReply { HotRealtimeHeader header = 1; oneof result { string publish = 2; bytes cold_control = 100; } }

message HotDeliverySessionPulse { HotDeliverySession session = 1; string kind = 2; uint64 sequence = 3; }
message HotDeliverySessionCall { HotRealtimeHeader header = 1; string source_shard_id = 2; HotDeliverySessionPulse pulse = 3; }
message HotDeliverySessionReply { HotRealtimeHeader header = 1; string result = 2; }
