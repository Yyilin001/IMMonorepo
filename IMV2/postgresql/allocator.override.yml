# Optional, measured profile for PostgreSQL 16.15 / Alpine 3.24 x86_64.
# Supply the verified library path explicitly; do not apply to other images.
services:
  postgres:
    image: postgres@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
    environment:
      LD_PRELOAD: /opt/im-allocator/libjemalloc.so.2
      MALLOC_CONF: narenas:1,dirty_decay_ms:1000,muzzy_decay_ms:0,background_thread:false
    volumes:
      - type: bind
        source: ${IM_V2_POSTGRES_ALLOCATOR_LIBRARY:?Set the absolute path of the verified jemalloc library}
        target: /opt/im-allocator/libjemalloc.so.2
        read_only: true
