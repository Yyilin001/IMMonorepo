# PostgreSQL 16 profile for the 2-GiB database container on the 4-vCPU IM host.
# Include from postgresql.conf; shared_buffers requires a controlled restart.
# This is not the 8-GiB database profile in docker-compose.server-override.yml.
# Keep max_connections/work_mem and the container memory limit unchanged.

# The old 128-MiB pool repeatedly evicted dirty pages onto foreground backends.
# Leave memory for backend processes and the operating system page cache.
shared_buffers = '512MB'
wal_buffers = -1                  # 16 MiB with the buffer pool above
bgwriter_lru_maxpages = 400
bgwriter_delay = '200ms'
bgwriter_lru_multiplier = 2.0

# Compress full-page images, never omit them. The larger soft WAL limit gives
# the buffer pool room to flush without changing the timed checkpoint interval.
wal_compression = lz4
max_wal_size = '2GB'
checkpoint_timeout = '5min'
checkpoint_completion_target = 0.9

# Acknowledged messages retain the existing synchronous durability contract.
fsync = on
synchronous_commit = on
full_page_writes = on

# The diagnostic runs enabled track_io_timing/track_wal_io_timing temporarily.
# They are deliberately not made permanent by this profile.
