# Controlled A/B overlay for the single-Gateway direct room-log benchmark.
#
# This changes only the upper bound of an already durable atomic append
# batch.  It keeps the 2 ms normal delay and the bounded 20 ms sustained-load
# delay from docker-compose.direct-room-log-adaptive-batching.yml.  No request
# is acknowledged before the same PostgreSQL transaction commits, and removal
# of this overlay restores the 16-item default without a data migration.
services:
  gateway:
    environment:
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_SIZE: "32"
