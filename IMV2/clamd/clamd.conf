# This file is shared read-only by clamd and the scan client.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/im-clamd/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
OfficialDatabaseOnly yes
BytecodeUnsigned no
HeuristicAlerts yes
AlertEncrypted yes
AlertExceedsMax yes
MaxFileSize 268435456
StreamMaxLength 268435456
MaxScanSize 536870912
MaxFiles 10000
MaxRecursion 16
MaxScanTime 90000
FollowDirectorySymlinks no
FollowFileSymlinks no
MaxThreads 2
MaxQueue 8
ConcurrentDatabaseReload no
SelfCheck 60
ReadTimeout 90
CommandReadTimeout 10
LogTime yes
