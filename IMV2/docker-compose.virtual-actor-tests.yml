# V1 fault topology. Images and probe/barrier contract are supplied by the
# integration owner; run_v2_virtual_actor_faults.sh refuses to start without
# them. No host port or production debug route is exposed.
name: imv2-va-v1

x-postgres-environment: &postgres-environment
  POSTGRES_USER: va_test
  POSTGRES_PASSWORD: va_test
  POSTGRES_DB: va_test

x-postgres-health: &postgres-health
  test: ["CMD-SHELL", "pg_isready -U va_test -d va_test"]
  interval: 1s
  timeout: 3s
  retries: 30

x-host-environment: &host-environment
  IMV2_VA_FAULT_OWNER_PRIMARY_URL: postgres://va_test:va_test@owner-primary:5432/va_test
  IMV2_VA_FAULT_OWNER_SECONDARY_URL: postgres://va_test:va_test@owner-secondary:5432/va_test
  IMV2_VA_FAULT_CONTROL_URL: postgres://va_test:va_test@control-db:5432/va_test
  IMV2_VA_FAULT_ACTOR_PORT: "7337"

services:
  owner-primary:
    image: postgres:16-alpine
    environment: *postgres-environment
    healthcheck: *postgres-health
    networks:
      owner-primary-a:
        aliases: [owner-primary]
      owner-primary-b:
        aliases: [owner-primary]
    volumes:
      - owner-primary-data:/var/lib/postgresql/data
    mem_limit: 1g

  owner-secondary:
    image: postgres:16-alpine
    environment: *postgres-environment
    healthcheck: *postgres-health
    networks:
      owner-secondary-a:
        aliases: [owner-secondary]
      owner-secondary-b:
        aliases: [owner-secondary]
    volumes:
      - owner-secondary-data:/var/lib/postgresql/data
    mem_limit: 1g

  control-db:
    image: postgres:16-alpine
    environment: *postgres-environment
    healthcheck: *postgres-health
    networks:
      control-a:
        aliases: [control-db]
      control-b:
        aliases: [control-db]
    volumes:
      - control-data:/var/lib/postgresql/data
    mem_limit: 1g

  host-a:
    image: ${IMV2_VA_FAULT_HOST_IMAGE:-imv2-va-host:pending}
    entrypoint: ["/usr/local/bin/IMV2ServerApp"]
    environment:
      <<: *host-environment
      IMV2_VA_FAULT_NODE_ID: host-a
      IMV2_VA_FAULT_ACTOR_ADVERTISE_HOST: host-a
    depends_on:
      owner-primary: {condition: service_healthy}
      owner-secondary: {condition: service_healthy}
      control-db: {condition: service_healthy}
    networks:
      - actor
      - owner-primary-a
      - owner-secondary-a
      - control-a
    mem_limit: 2g

  host-b:
    image: ${IMV2_VA_FAULT_HOST_IMAGE:-imv2-va-host:pending}
    entrypoint: ["/usr/local/bin/IMV2ServerApp"]
    environment:
      <<: *host-environment
      IMV2_VA_FAULT_NODE_ID: host-b
      IMV2_VA_FAULT_ACTOR_ADVERTISE_HOST: host-b
    depends_on:
      owner-primary: {condition: service_healthy}
      owner-secondary: {condition: service_healthy}
      control-db: {condition: service_healthy}
    networks:
      - actor
      - owner-primary-b
      - owner-secondary-b
      - control-b
    mem_limit: 2g

  probe:
    image: ${IMV2_VA_FAULT_PROBE_IMAGE:-imv2-va-probe:pending}
    entrypoint: ["/usr/local/bin/IMV2VAFaultProbe"]
    environment:
      IMV2_VA_FAULT_HOST_A: host-a:7337
      IMV2_VA_FAULT_HOST_B: host-b:7337
    depends_on:
      - host-a
      - host-b
    networks:
      - actor
    volumes:
      # Test-only file barrier/evidence channel; no production HTTP route.
      - ${IMV2_VA_FAULT_ARTIFACT_DIR:-/tmp/imv2-va-v1-fault-artifacts}:/fault-control:rw
    mem_limit: 1g

networks:
  actor: {internal: true}
  owner-primary-a: {internal: true}
  owner-primary-b: {internal: true}
  owner-secondary-a: {internal: true}
  owner-secondary-b: {internal: true}
  control-a: {internal: true}
  control-b: {internal: true}

volumes:
  owner-primary-data:
  owner-secondary-data:
  control-data:
