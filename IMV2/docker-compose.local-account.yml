# Local V2 account-factor stack. It intentionally publishes only the Caddy
# HTTPS listener to macOS loopback. PostgreSQL and the account service remain
# on this Compose network and are never reachable from the LAN.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: im_v2
      POSTGRES_USER: im_v2
      POSTGRES_PASSWORD: ${IM_V2_LOCAL_POSTGRES_PASSWORD:?run IMV2/scripts/run_v2_local_account_stack.sh first}
    volumes:
      - v2-local-account-postgres:/var/lib/postgresql/data
      # Mount the canonical initialization files explicitly. Mounting the
      # whole directory makes a fresh cluster depend on the lexical ordering
      # of any stale deployment-side SQL artifacts.
      - ./sql/00-pg-stat-statements.sql:/docker-entrypoint-initdb.d/00-pg-stat-statements.sql:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_v2 -d im_v2"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    pids_limit: 128

  account:
    image: imv2localaccount-v2server
    # HTTP and workers drain first, followed by up to 60s for Room Actor
    # transport and outstanding SQL; leave cleanup time before SIGKILL.
    stop_grace_period: 180s
    env_file:
      - .env.local
    environment:
      IMV2_ROOM_ACTOR_CONFIGURATION_FILE: /run/im-v2-room-actor/configuration.json
      IM_V2_DATABASE_URL: postgres://im_v2:${IM_V2_LOCAL_POSTGRES_PASSWORD}@postgres:5432/im_v2
      IM_V2_DATABASE_EVENT_LOOP_THREADS: 2
      IM_V2_DATABASE_MAX_CONNECTIONS_PER_EVENT_LOOP: 4
      IM_V2_DATABASE_MAX_TOTAL_CONNECTIONS: 16
      IM_V2_MAX_USER_SHARD_STORES: 1
      IM_V2_DATABASE_CONNECT_TIMEOUT_MS: 5000
      IM_V2_DATABASE_POOL_TIMEOUT_MS: 3000
      IM_V2_DATABASE_STATEMENT_TIMEOUT_MS: 5000
      IM_V2_DATABASE_LOCK_TIMEOUT_MS: 2000
      IM_V2_DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: 10000
      IM_V2_ACCOUNT_LISTEN_HOST: 127.0.0.1
      IM_V2_ACCOUNT_LISTEN_PORT: 8444
      IM_V2_PASSWORD_LOGIN_MAX_FAILURES: 5
      IM_V2_PASSWORD_LOGIN_WINDOW_SECONDS: 900
      IM_V2_PASSWORD_LOGIN_LOCKOUT_SECONDS: 900
      # The local iOS E2E runner intentionally creates disposable accounts
      # across two independently booted simulators. Keep a finite edge limit,
      # but leave enough headroom for one complete dual-simulator run without
      # coupling its outcome to a previous local test invocation.
      IM_V2_ACCOUNT_CLIENT_RATE_LIMIT_MAX_REQUESTS: 240
      IM_V2_ACCOUNT_CLIENT_RATE_LIMIT_WINDOW_SECONDS: 60
      IM_V2_MAX_ACTIVE_DEVICES_PER_ACCOUNT: 8
      IM_V2_MAX_NEW_DEVICES_PER_WINDOW: 16
      IM_V2_DEVICE_REGISTRATION_WINDOW_SECONDS: 2592000
      IM_V2_PUBLIC_IDENTITY_LOOKUP_MAX_QUERIES: 30
      IM_V2_PUBLIC_IDENTITY_LOOKUP_WINDOW_SECONDS: 60
      IM_V2_CAPACITY_PROFILE_ID: standard
      IM_V2_MAX_ELIGIBLE_MEMBERS: 100000
      IM_V2_MAX_COMMANDS_PER_WINDOW: 1000
      IM_V2_RATE_LIMIT_RETRY_AFTER_SECONDS: 3
      # Explicit local-only filesystem substitute for an object store. The
      # signed targets still traverse Caddy over HTTPS, so the iOS upload and
      # download path exercises the same client boundary as production.
      IM_V2_ROOM_SHARD_STORES_JSON: '[{"shard_id":"rooms-primary","database_url":"postgres://im_v2:${IM_V2_LOCAL_POSTGRES_PASSWORD}@postgres:5432/im_v2","schema":"im_v2"}]'
      IM_V2_USER_SHARD_STORES_JSON: '[{"bucket":"users-primary","database_url":"postgres://im_v2:${IM_V2_LOCAL_POSTGRES_PASSWORD}@postgres:5432/im_v2","schema":"im_v2"}]'
      IM_V2_LOCAL_MEDIA_MODE: filesystem
      IM_V2_LOCAL_MEDIA_UNSAFE_TEST_ONLY: "1"
      IM_V2_LOCAL_MEDIA_ROOT_DIRECTORY: /var/lib/im-v2-local-media
      IM_V2_LOCAL_MEDIA_PUBLIC_BASE_URL: https://localhost:8443
      IM_V2_LOCAL_MEDIA_MAXIMUM_BYTES: 52428800
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The account listener must be accepting connections before Caddy is
      # considered usable; a merely running process can still be initializing
      # its database and route graph.
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/8444'"]
      interval: 1s
      timeout: 3s
      retries: 30
    # Caddy joins this container's network namespace. The only host-published
    # port therefore belongs to Caddy, while the account listener stays loopback.
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./local-room-actors/account:/run/im-v2-room-actor:ro
      - v2-local-media-objects:/var/lib/im-v2-local-media
    mem_limit: 2g
    pids_limit: 256

  gateway:
    image: imv2localaccount-v2server
    # TLS/HTTP and workers drain before the room actor's 60s drain deadline.
    # Database resources are closed only after both drains complete.
    stop_grace_period: 180s
    command: ["/workspace/IMV2Server/.build/release/IMV2ServerApp"]
    env_file:
      - .env.local
    environment:
      IMV2_ROOM_ACTOR_CONFIGURATION_FILE: /run/im-v2-room-actor/configuration.json
      IM_V2_LOCAL_MEDIA_MODE: filesystem
      IM_V2_LOCAL_MEDIA_UNSAFE_TEST_ONLY: "1"
      IM_V2_LOCAL_MEDIA_ROOT_DIRECTORY: /var/lib/im-v2-local-media
      IM_V2_LOCAL_MEDIA_PUBLIC_BASE_URL: https://localhost:8443
      IM_V2_LOCAL_MEDIA_MAXIMUM_BYTES: 52428800
      IM_V2_DATABASE_URL: postgres://im_v2:${IM_V2_LOCAL_POSTGRES_PASSWORD}@postgres:5432/im_v2
      # The gateway has foreground command/sync work plus durable fan-out in
      # one process. One connection per event loop can deadlock that mix.
      IM_V2_DATABASE_MAX_CONNECTIONS_PER_EVENT_LOOP: 8
      IM_V2_DATABASE_FOREGROUND_CONNECTIONS_PER_EVENT_LOOP: 4
      IM_V2_DATABASE_SYNC_CONNECTIONS_PER_EVENT_LOOP: 1
      IM_V2_DATABASE_DELIVERY_CONNECTIONS_PER_EVENT_LOOP: 1
      IM_V2_DATABASE_PROJECTION_CONNECTIONS_PER_EVENT_LOOP: 1
      IM_V2_DATABASE_MAINTENANCE_CONNECTIONS_PER_EVENT_LOOP: 1
      IM_V2_DATABASE_WORKLOAD_POOL_ISOLATION_ENABLED: "false"
      IM_V2_DATABASE_EVENT_LOOP_THREADS: 4
      IM_V2_DATABASE_MAX_TOTAL_CONNECTIONS: 512
      IM_V2_MAX_USER_SHARD_STORES: 16
      IM_V2_DATABASE_CONNECT_TIMEOUT_MS: 5000
      IM_V2_DATABASE_POOL_TIMEOUT_MS: 3000
      IM_V2_DATABASE_STATEMENT_TIMEOUT_MS: 5000
      IM_V2_DATABASE_LOCK_TIMEOUT_MS: 2000
      IM_V2_DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: 10000
      IM_V2_TLS_HOST: 0.0.0.0
      IM_V2_TLS_PORT: 7443
      IM_V2_TLS_CERTIFICATE_CHAIN_PATH: /caddy/caddy/certificates/local/localhost/localhost.crt
      IM_V2_TLS_PRIVATE_KEY_PATH: /caddy/caddy/certificates/local/localhost/localhost.key
      IM_V2_CAPABILITY_PROFILE: base
      IM_V2_MAX_MESSAGE_UTF8_BYTES: 4096
      IM_V2_MAX_FRAME_BYTES: 65536
      IM_V2_MAX_PROTOBUF_MESSAGE_DEPTH: 32
      IM_V2_MAX_IN_FLIGHT_REQUESTS: 32
      IM_V2_MAX_CONNECTIONS: 10000
      IM_V2_LISTEN_BACKLOG: 4096
      IM_V2_ACCEPT_BATCH_SIZE: 256
      IM_V2_MAX_CONNECTIONS_PER_DEVICE: 2
      IM_V2_MAX_CONNECTIONS_PER_USER: 8
      IM_V2_DEVICE_COMMANDS_PER_SECOND: 32
      IM_V2_DEVICE_COMMAND_BURST: 64
      IM_V2_USER_COMMANDS_PER_SECOND: 128
      IM_V2_USER_COMMAND_BURST: 256
      IM_V2_RATE_LIMIT_MAX_TRACKED_IDENTITIES: 20000
      IM_V2_MAX_QUEUED_INBOUND_BYTES: 262144
      IM_V2_MAX_QUEUED_INBOUND_CHUNKS: 512
      IM_V2_AUTHENTICATION_TIMEOUT_MS: 10000
      IM_V2_IDLE_TIMEOUT_MS: 60000
      IM_V2_WORKER_BATCH_SIZE: 256
      IM_V2_WORKER_POLL_INTERVAL_MS: 100
      IM_V2_USER_PROJECTION_CONCURRENCY: 2
      IM_V2_USER_PROJECTION_MAX_CONSECUTIVE_BUSY_PASSES: 16
      IM_V2_USER_PROJECTION_BUSY_DRAIN_BUDGET_MS: 50
      IM_V2_FOREGROUND_WRITE_DATABASE_WORK_LIMIT: 9
      IM_V2_FOREGROUND_CONTROL_WRITE_DATABASE_WORK_LIMIT: 3
      IM_V2_INTERACTIVE_READ_DATABASE_WORK_LIMIT: 4
      IM_V2_SYNC_DATABASE_WORK_LIMIT: 4
      IM_V2_FOREGROUND_WRITE_DATABASE_WORK_MAX_QUEUED: 288
      IM_V2_FOREGROUND_CONTROL_WRITE_DATABASE_WORK_MAX_QUEUED: 288
      IM_V2_INTERACTIVE_READ_DATABASE_WORK_MAX_QUEUED: 96
      IM_V2_SYNC_DATABASE_WORK_MAX_QUEUED: 128
      IM_V2_DATABASE_WORK_ADMISSION_TIMEOUT_MS: 200
      IM_V2_DATABASE_WORK_ADMISSION_ENABLED: "true"
      IM_V2_SYNC_WAKE_COALESCING_MS: 40
      IM_V2_SYNC_WAKE_MAX_PENDING_USERS: 50000
      IM_V2_SYNC_WAKE_DELIVERY_CONCURRENCY: 64
      IM_V2_SYNC_WAKE_COALESCING_ENABLED: "true"
      IM_V2_COMMAND_SUCCESS_LOG_SAMPLE_PERMILLE: 10
      IM_V2_COMMAND_SLOW_LOG_THRESHOLD_MS: 250
      IM_V2_COMMAND_DIAGNOSTIC_LOG_MAX_PER_SECOND: 20
      IM_V2_MESSAGE_PROJECTION_STATE_RETENTION_SECONDS: 604800
      # 本地真实账号画像显式固定兼容基线：单聊与标准群都按逐用户投递运行，
      # 不随部署默认值变化而改变自己的验证目标。
      IM_V2_DURABLE_RETRY_INITIAL_DELAY_MS: 1000
      IM_V2_DURABLE_RETRY_MAX_DELAY_MS: 60000
      IM_V2_DURABLE_RETRY_MAX_ATTEMPTS: 10
      IM_V2_DURABLE_RETRY_JITTER_PERCENT: 20
      IM_V2_MAINTENANCE_POLL_INTERVAL_MS: 60000
      IM_V2_BACKLOG_MAINTENANCE_IDLE_POLL_INTERVAL_MS: 1000
      IM_V2_BACKLOG_MAINTENANCE_MAX_CONSECUTIVE_BUSY_PASSES: 4
      IM_V2_BACKLOG_MAINTENANCE_BUSY_DRAIN_BUDGET_MS: 100
      IM_V2_MEDIA_WITHDRAWN_RETENTION_SECONDS: 2592000
      IM_V2_IDEMPOTENCY_RETENTION_SECONDS: 3888000
      IM_V2_METRICS_HOST: 127.0.0.1
      IM_V2_METRICS_PORT: 9464
      IM_V2_METRICS_MINIMUM_REFRESH_INTERVAL_MS: 30000
      IM_V2_METRICS_REFRESH_TIMEOUT_MS: 4000
      IM_V2_GATEWAY_NODE_ID: local-gateway-1
      IM_V2_GATEWAY_REPLICA_COUNT: "1"
      IM_V2_USER_SHARD_BUCKET: users-primary
      IM_V2_USER_SHARD_ROUTER_EPOCH: 1
      IM_V2_DIRECT_ROOM_SHARD_ID: rooms-primary
      IM_V2_GROUP_ROOM_SHARD_ID: rooms-primary
      IM_V2_STRANGER_MESSAGE_MAX_PER_WINDOW: 3
      IM_V2_STRANGER_MESSAGE_WINDOW_SECONDS: 86400
      IM_V2_CONTENT_REVIEW_MODE: disabled
      IM_V2_CAPACITY_PROFILE_ID: standard
      IM_V2_MAX_ELIGIBLE_MEMBERS: 100000
      IM_V2_MAX_COMMANDS_PER_WINDOW: 1000
      IM_V2_RATE_LIMIT_RETRY_AFTER_SECONDS: 3
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_started
    healthcheck:
      # The public TLS port is the gateway readiness boundary. It is checked
      # from inside the service container and is never exposed beyond loopback
      # on the macOS host.
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/7443'"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:7443:7443"
    volumes:
      - ./local-room-actors/gateway:/run/im-v2-room-actor:ro
      - v2-local-caddy-data:/caddy:ro
      - v2-local-media-objects:/var/lib/im-v2-local-media
    restart: on-failure:5
    mem_limit: 2g
    pids_limit: 256

  # This process is deliberately not published to the host, Caddy, or any
  # application-facing network edge. The local smoke script enters its own
  # container namespace to exercise the same loopback-only operator boundary
  # that production must place behind a bastion or mTLS proxy.
  operator:
    image: imv2localaccount-v2server
    # Cover both 30s HTTP phases, 30s of worker drain, and cleanup headroom.
    stop_grace_period: 120s
    command: ["/workspace/IMV2Server/.build/release/IMV2OperatorServerApp"]
    env_file:
      - .env.local
    environment:
      IM_V2_DATABASE_URL: postgres://im_v2:${IM_V2_LOCAL_POSTGRES_PASSWORD}@postgres:5432/im_v2
      IM_V2_DATABASE_EVENT_LOOP_THREADS: 2
      IM_V2_DATABASE_MAX_CONNECTIONS_PER_EVENT_LOOP: 4
      IM_V2_DATABASE_MAX_TOTAL_CONNECTIONS: 32
      IM_V2_MAX_USER_SHARD_STORES: 16
      IM_V2_DATABASE_CONNECT_TIMEOUT_MS: 5000
      IM_V2_DATABASE_POOL_TIMEOUT_MS: 3000
      IM_V2_DATABASE_STATEMENT_TIMEOUT_MS: 30000
      IM_V2_DATABASE_LOCK_TIMEOUT_MS: 5000
      IM_V2_DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: 60000
      IM_V2_OPERATOR_REPLAY_LISTEN_HOST: 127.0.0.1
      IM_V2_OPERATOR_REPLAY_LISTEN_PORT: 9445
      IM_V2_OPERATOR_REPLAY_PRINCIPAL: local-operator-replay
      IM_V2_OPERATOR_ACCOUNT_DISABLE_PRINCIPAL: local-account-safety
      IM_V2_CAPABILITY_PROFILE: base
      IM_V2_ROOM_SHARD_STORES_JSON: '[{"shard_id":"rooms-primary","database_url":"postgres://im_v2:${IM_V2_LOCAL_POSTGRES_PASSWORD}@postgres:5432/im_v2","schema":"im_v2"}]'
      IM_V2_USER_SHARD_STORES_JSON: '[{"bucket":"users-primary","database_url":"postgres://im_v2:${IM_V2_LOCAL_POSTGRES_PASSWORD}@postgres:5432/im_v2","schema":"im_v2"}]'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/9445'"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    pids_limit: 128

  caddy:
    image: caddy:2.8-alpine
    network_mode: service:account
    environment:
      IM_V2_ACCOUNT_EDGE_AUTHORIZATION_SECRET_BASE64: ${IM_V2_ACCOUNT_EDGE_AUTHORIZATION_SECRET_BASE64:?run IMV2/scripts/run_v2_local_account_stack.sh first}
    volumes:
      - ./local/Caddyfile:/etc/caddy/Caddyfile:ro
      - v2-local-caddy-data:/data
      - v2-local-caddy-config:/config
    mem_limit: 256m
    pids_limit: 64

volumes:
  v2-local-account-postgres:
  v2-local-caddy-data:
  v2-local-caddy-config:
  v2-local-media-objects:
