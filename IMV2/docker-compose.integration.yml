services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: im_v2_test
      POSTGRES_USER: im_v2_test
      POSTGRES_PASSWORD: im_v2_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_v2_test -d im_v2_test"]
      interval: 1s
      timeout: 3s
      retries: 30
