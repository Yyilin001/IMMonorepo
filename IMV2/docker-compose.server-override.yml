# Single-node deployment overlay for the 8-vCPU / 16-GiB load-test host.
# The base compose file intentionally stays suitable for a developer laptop;
# this overlay supplies server restart policy, file-descriptor ceilings and a
# bounded PostgreSQL memory/WAL budget without weakening commit durability.
# The limits total 12.75 GiB, leaving roughly 2 GiB for the kernel and Docker
# on the 14.85-GiB host. PostgreSQL owns the largest share because the durable
# working set is larger than 6 GiB; keeping the database at the old 4-GiB
# limit forced the cgroup to repeatedly evict and refault database pages while
# the host still had reclaimable memory.
services:
  postgres:
    restart: unless-stopped
    mem_limit: 8g
    shm_size: 2g
    # PostgreSQL uses one OS process per client connection in addition to
    # checkpointer, WAL, autovacuum and parallel-worker processes. The base
    # laptop limit of 128 cannot satisfy this overlay's max_connections=150
    # and caused connection resets before the database reached a CPU or I/O
    # limit during a 50k authentication ramp. Keep max_connections as the
    # database admission bound and leave process headroom for its workers.
    pids_limit: 256
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - max_connections=150
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=1GB
      - -c
      # A sustained 5,000 msg/s profile emits about 5.9 GB of WAL in 18
      # minutes. Four GB caused size-driven checkpoints, while a 15-minute
      # timed checkpoint landed in the highest-rate phase and regenerated
      # roughly 0.5 million full-page images. Ten GB keeps this 30-minute
      # interval below PostgreSQL's soft WAL checkpoint threshold while
      # retaining a bounded WAL/disk budget.
      - max_wal_size=10GB
      - -c
      # Compress only full-page images. fsync, full_page_writes and
      # synchronous_commit remain enabled, so this changes cost, not the
      # acknowledged durability contract.
      - wal_compression=lz4
      - -c
      # Longer intervals reduce first-write-after-checkpoint full-page image
      # churn. Durability remains synchronous; the trade-off is a longer
      # crash-recovery window, which the 10-GB WAL bound keeps finite.
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      # The default writer repeatedly reached its 100-page cap and left
      # millions of buffer writes to foreground PostgreSQL backends. Run
      # smaller, more frequent rounds with enough headroom to keep reusable
      # buffers clean. Profile deltas must prove this reduces buffers_backend
      # without creating an I/O storm.
      - bgwriter_delay=50ms
      - -c
      - bgwriter_lru_maxpages=1000
      - -c
      - bgwriter_lru_multiplier=4.0
      - -c
      - bgwriter_flush_after=512kB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  account:
    restart: unless-stopped
    mem_limit: 1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  gateway:
    restart: unless-stopped
    mem_limit: 3g
    # The gateway drains listeners, then cancellation and workers, before
    # releasing database resources. Cover both HTTP phases, worker drain,
    # and cleanup before Docker can send SIGKILL/exit 137.
    stop_grace_period: 120s
    environment:
      IM_V2_SHUTDOWN_GRACE_MS: 20000
      # A delivery pass holds one PostgreSQL connection while it leases rows,
      # then performs commit-sized projection transactions. The generic 100k
      # profile permits much larger claims, but that burst can monopolize this
      # single 8-vCPU host before PostgreSQL itself is saturated. Eight lanes
      # of 256 rows retain a bounded 2,048-delivery budget per worker pass.
      # Four event loops expose a 64-connection Gateway ceiling. The role
      # values below are retained for controlled isolation A/B runs, but the
      # default shared topology lets a hot class borrow idle capacity. The
      # write/read/Sync admission limits below reserve 16 shared slots for
      # durable workers before Fluent pool wait. PostgreSQL max_connections
      # must separately include Account, Operator and operational headroom.
      IM_V2_DATABASE_MAX_CONNECTIONS_PER_EVENT_LOOP: 16
      IM_V2_DATABASE_FOREGROUND_CONNECTIONS_PER_EVENT_LOOP: 8
      IM_V2_DATABASE_SYNC_CONNECTIONS_PER_EVENT_LOOP: 4
      IM_V2_DATABASE_DELIVERY_CONNECTIONS_PER_EVENT_LOOP: 2
      IM_V2_DATABASE_PROJECTION_CONNECTIONS_PER_EVENT_LOOP: 1
      IM_V2_DATABASE_MAINTENANCE_CONNECTIONS_PER_EVENT_LOOP: 1
      # Shared borrowing remains the production default until an identical
      # workload proves a role split improves both foreground and convergence
      # SLOs. The role budgets above remain an explicit rollback experiment.
      IM_V2_DATABASE_WORKLOAD_POOL_ISOLATION_ENABLED: "false"
      # Message appends, control writes, and interactive reads reserve 12/4/16
      # of one 32-permit foreground admission budget. The controller is
      # work-conserving: a hot lane can borrow an idle peer reservation, but
      # a queued peer receives the next released permit. A clean 100-room,
      # 1,000-msg/s room-log run improved message P95 from 229 to 207 ms and
      # room-log P95 from 193 to 129 ms with this 4-permit transfer; it does
      # not add PostgreSQL connections or weaken canonical-write durability.
      IM_V2_FOREGROUND_WRITE_DATABASE_WORK_LIMIT: 12
      IM_V2_FOREGROUND_CONTROL_WRITE_DATABASE_WORK_LIMIT: 4
      IM_V2_INTERACTIVE_READ_DATABASE_WORK_LIMIT: 16
      IM_V2_SYNC_DATABASE_WORK_LIMIT: 16
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  operator:
    restart: unless-stopped
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  caddy:
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
