# Single-node deployment overlay for the 8-vCPU / 16-GiB load-test host.
# The base compose file intentionally stays suitable for a developer laptop;
# this overlay supplies server restart policy, file-descriptor ceilings and a
# bounded PostgreSQL memory/WAL budget without weakening commit durability.
# The limits total 12.75 GiB, leaving roughly 2 GiB for the kernel and Docker
# on the 14.85-GiB host. PostgreSQL owns the largest share because the durable
# working set is larger than 6 GiB; keeping the database at the old 4-GiB
# limit forced the cgroup to repeatedly evict and refault database pages while
# the host still had reclaimable memory.
services:
  postgres:
    restart: unless-stopped
    mem_limit: 8g
    shm_size: 2g
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - wal_buffers=16MB
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  account:
    restart: unless-stopped
    mem_limit: 1g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  gateway:
    restart: unless-stopped
    mem_limit: 3g
    environment:
      # A delivery pass holds one PostgreSQL connection while it leases rows,
      # then performs commit-sized projection transactions. The generic 100k
      # profile allows eight concurrent 2,000-row claims, but that burst can
      # monopolize a 32-connection pool on this single 8-vCPU host and reject
      # foreground sends before PostgreSQL itself is saturated. Eight bounded
      # claim lanes preserve the measured 2,048-delivery budget per pass. The
      # server partitions those lanes by target user, so they no longer fight
      # Four event loops expose a 64-connection Gateway ceiling. The role
      # values below are retained for controlled isolation A/B runs, but the
      # default shared topology lets a hot class borrow idle capacity. The
      # foreground/Sync admission limits below reserve 16 shared slots for
      # durable workers before Fluent pool wait. PostgreSQL max_connections
      # must separately include Account, Operator and operational headroom.
      IM_V2_DATABASE_MAX_CONNECTIONS_PER_EVENT_LOOP: 16
      IM_V2_DATABASE_FOREGROUND_CONNECTIONS_PER_EVENT_LOOP: 8
      IM_V2_DATABASE_SYNC_CONNECTIONS_PER_EVENT_LOOP: 4
      IM_V2_DATABASE_DELIVERY_CONNECTIONS_PER_EVENT_LOOP: 2
      IM_V2_DATABASE_PROJECTION_CONNECTIONS_PER_EVENT_LOOP: 1
      IM_V2_DATABASE_MAINTENANCE_CONNECTIONS_PER_EVENT_LOOP: 1
      # Shared borrowing remains the production default until an identical
      # workload proves a role split improves both foreground and convergence
      # SLOs. The role budgets above remain an explicit rollback experiment.
      IM_V2_DATABASE_WORKLOAD_POOL_ISOLATION_ENABLED: "false"
      IM_V2_FOREGROUND_DATABASE_WORK_LIMIT: 32
      IM_V2_SYNC_DATABASE_WORK_LIMIT: 16
      IM_V2_FANOUT_DELIVERY_CLAIM_BATCH_SIZE: 256
      IM_V2_MAX_DELIVERY_CONCURRENCY: 8
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  operator:
    restart: unless-stopped
    mem_limit: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  caddy:
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
