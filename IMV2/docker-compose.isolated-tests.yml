# Fully isolated Core + Server/PostgreSQL test environment. ClientKit runs
# natively on macOS. No service port is published to macOS; the source mount
# is read-only and all container build/test artifacts stay in the VM.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: im_v2_test
      POSTGRES_USER: im_v2_test
      POSTGRES_PASSWORD: im_v2_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_v2_test -d im_v2_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    pids_limit: 128

  # Deliberately separate PostgreSQL process for cross-store fan-out tests.
  # No port is published; the Swift test container alone can reach it.
  postgres-secondary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: im_v2_secondary_test
      POSTGRES_USER: im_v2_secondary_test
      POSTGRES_PASSWORD: im_v2_secondary_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_v2_secondary_test -d im_v2_secondary_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    pids_limit: 128

  swift-tests:
    build:
      # The image does not copy source; keep build context narrow. The full
      # repository is mounted read-only only when the test container starts.
      context: .
      dockerfile: Dockerfile.isolated-tests
    depends_on:
      postgres:
        condition: service_healthy
      postgres-secondary:
        condition: service_healthy
    environment:
      IMV2_POSTGRES_TEST_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_POSTGRES_TEST_SECONDARY_DATABASE_URL: postgres://im_v2_secondary_test:im_v2_secondary_test@postgres-secondary:5432/im_v2_secondary_test
      IMV2_POSTGRES_TEST_DATABASE_IS_DISPOSABLE: "1"
      # A cold SwiftPM dependency mirror can take several minutes. This is a
      # wall-clock watchdog, not a relaxation of the CPU/memory/PID limits.
      V2_TEST_TIMEOUT_SECONDS: "1200"
      HOME: /tmp/home
      XDG_CACHE_HOME: /tmp/cache
      CLANG_MODULE_CACHE_PATH: /tmp/clang-module-cache
    volumes:
      - ..:/workspace:ro
      # Persist only fetched dependency mirrors inside the Colima VM. It never
      # mounts into macOS and is removed explicitly with `docker volume rm`.
      - swiftpm-cache:/tmp/cache
      # Keep package-specific compiler artifacts in the VM too. The source
      # mount stays read-only, and this avoids recompiling GRDB on every
      # isolated regression run.
      - swiftpm-build-cache:/tmp/swiftpm
    read_only: true
    tmpfs:
      - /tmp:exec,size=10g
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256

volumes:
  swiftpm-cache:
  swiftpm-build-cache:
