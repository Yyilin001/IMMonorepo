# Fully isolated Core + Server/PostgreSQL test environment. ClientKit runs
# natively on macOS. No service port is published to macOS; the source mount
# is read-only and all container build/test artifacts stay in the VM.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: im_v2_test
      POSTGRES_USER: im_v2_test
      POSTGRES_PASSWORD: im_v2_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_v2_test -d im_v2_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    pids_limit: 128
    volumes:
      # The integration suite drops its disposable `im_v2` schema after each
      # run. Naming the cluster volume avoids accumulating anonymous volumes
      # whenever Compose recreates this service between capacity profiles.
      - postgres-test-data:/var/lib/postgresql/data

  # Deliberately separate PostgreSQL process for cross-store fan-out tests.
  # No port is published; the Swift test container alone can reach it.
  postgres-secondary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: im_v2_secondary_test
      POSTGRES_USER: im_v2_secondary_test
      POSTGRES_PASSWORD: im_v2_secondary_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_v2_secondary_test -d im_v2_secondary_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    pids_limit: 128
    volumes:
      - postgres-secondary-test-data:/var/lib/postgresql/data

  # A third disposable cluster keeps control-store tests independent of both
  # the primary and secondary cross-store databases.
  postgres-control:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: im_v2_control_test
      POSTGRES_USER: im_v2_control_test
      POSTGRES_PASSWORD: im_v2_control_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_v2_control_test -d im_v2_control_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    pids_limit: 128
    volumes:
      - postgres-control-test-data:/var/lib/postgresql/data

  # Optional wake hints are never a correctness dependency, but the isolated
  # Server suite verifies that the minimal NIO publisher reaches a real Core
  # NATS subscriber and emits only its privacy-safe trigger envelope.
  nats:
    image: nats:2.11-alpine
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    pids_limit: 64

  swift-tests:
    build:
      # The image does not copy source; keep build context narrow. The full
      # repository is mounted read-only only when the test container starts.
      context: .
      dockerfile: Dockerfile.isolated-tests
    depends_on:
      postgres:
        condition: service_healthy
      postgres-secondary:
        condition: service_healthy
      postgres-control:
        condition: service_healthy
      nats:
        condition: service_healthy
    # Keep the broker-free production rule intact while allowing the real
    # Core NATS integration test to use the explicitly permitted loopback
    # plaintext mode. No NATS bytes cross the Compose bridge network.
    network_mode: "service:nats"
    environment:
      IMV2_POSTGRES_TEST_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_POSTGRES_TEST_SECONDARY_DATABASE_URL: postgres://im_v2_secondary_test:im_v2_secondary_test@postgres-secondary:5432/im_v2_secondary_test
      IMV2_POSTGRES_TEST_CONTROL_DATABASE_URL: postgres://im_v2_control_test:im_v2_control_test@postgres-control:5432/im_v2_control_test
      IMV2_POSTGRES_TEST_DATABASE_IS_DISPOSABLE: "1"
      IMV2_REQUIRE_CROSS_STORE_POSTGRES_TESTS: "1"
      # Actor suites deliberately require their own disposable opt-ins. Run
      # these serially with the ordinary schema-resetting integration suites.
      IMV2_ACTOR_TRANSACTION_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_ACTOR_TRANSACTION_TEST_DATABASE_IS_DISPOSABLE: "1"
      IMV2_ACTOR_ACK_LOSS_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_ACTOR_ACK_LOSS_TEST_DATABASE_IS_DISPOSABLE: "1"
      IMV2_SHARED_SEND_ACK_LOSS_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_SHARED_SEND_ACK_LOSS_TEST_DATABASE_IS_DISPOSABLE: "1"
      IMV2_ACTOR_D2_TEST_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_ACTOR_D2_TEST_DATABASE_IS_DISPOSABLE: "1"
      IMV2_ACTOR_D4_CONTROL_DATABASE_URL: postgres://im_v2_control_test:im_v2_control_test@postgres-control:5432/im_v2_control_test
      IMV2_ACTOR_D4_OWNER_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_ACTOR_D4_TEST_DATABASE_IS_DISPOSABLE: "1"
      IMV2_ACTOR_D5_OWNER_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_ACTOR_D5_TEST_DATABASE_IS_DISPOSABLE: "1"
      IMV2_ACTOR_D5_SOURCE_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_ACTOR_D5_TARGET_DATABASE_URL: postgres://im_v2_secondary_test:im_v2_secondary_test@postgres-secondary:5432/im_v2_secondary_test
      IMV2_ACTOR_D5_IMPORT_TEST_DATABASE_IS_DISPOSABLE: "1"
      IMV2_ACTOR_D5_MEDIA_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
      IMV2_ACTOR_D5_MEDIA_TEST_DATABASE_IS_DISPOSABLE: "1"
      IMV2_REAL_NATS_URL: nats://127.0.0.1:4222
      # Cold compilation plus the complete PostgreSQL suite running serially
      # can exceed an hour. This is a wall-clock watchdog, not a relaxation
      # of individual test, SQL, or container resource limits.
      V2_TEST_TIMEOUT_SECONDS: "10800"
      # The Server test module has a high cold-compile peak. One compiler job
      # trades speed for a repeatable run inside the fixed container envelope;
      # callers can still explicitly raise it on a larger isolated runner.
      V2_SWIFTPM_JOBS: "1"
      HOME: /tmp/home
      XDG_CACHE_HOME: /tmp/cache
      CLANG_MODULE_CACHE_PATH: /tmp/clang-module-cache
    volumes:
      - ..:/workspace:ro
      # Persist only fetched dependency mirrors inside the Colima VM. It never
      # mounts into macOS and is removed explicitly with `docker volume rm`.
      - swiftpm-cache:/tmp/cache
      # Keep package-specific compiler artifacts in the VM too. The source
      # mount stays read-only, and this avoids recompiling GRDB on every
      # isolated regression run.
      - swiftpm-build-cache:/tmp/swiftpm
    read_only: true
    tmpfs:
      - /tmp:exec,size=10g
    # The dedicated local capacity profile has four virtual CPUs and 16 GiB
    # RAM. Leave headroom for three PostgreSQL instances and NATS while letting
    # the four delivery workers contend under the intended CPU envelope.
    cpus: 4.0
    mem_limit: 12g
    pids_limit: 256

volumes:
  postgres-test-data:
  postgres-secondary-test-data:
  postgres-control-test-data:
  swiftpm-cache:
  swiftpm-build-cache:
