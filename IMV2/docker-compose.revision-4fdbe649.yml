# Candidate image for the hot direct-room command-credit path. Keep this
# revision overlay separate so an A/B run can switch the complete server
# process set atomically and roll back to the prior image by removing it.
services:
  account:
    image: imv2-server:hot-direct-4fdbe649
    command: ["/workspace/IMV2Server/.build/release/IMV2AccountServerApp"]

  gateway:
    image: imv2-server:hot-direct-4fdbe649
    environment:
      # The single-node load database was explicitly seeded with this
      # immutable profile and its eight room admission pools. Pinning the
      # candidate prevents fresh direct pairs from selecting the stale v2
      # profile, for which no durable pool exists.
      IM_V2_CAPACITY_PROFILE_ID: "loadtest-v12"
      # A hot room reserves at most 32 commands at a time.  PostgreSQL
      # charges the room window before handing out a local token, so this
      # removes up to 31 otherwise separate room_admission update
      # transactions without allowing an over-admit.  Sparse rooms retain
      # the normal per-command admission path until their committed-message
      # heat threshold is crossed; a gateway crash can conservatively waste
      # at most 31 credits for each active hot room and never creates a
      # message without durable capacity.
      IM_V2_DIRECT_ROOM_LOG_ROOM_CREDIT_BATCH_SIZE: "32"

  operator:
    image: imv2-server:hot-direct-4fdbe649
    command: ["/workspace/IMV2Server/.build/release/IMV2OperatorServerApp"]
