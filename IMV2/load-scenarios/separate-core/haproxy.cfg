global
  maxconn 64000
  nbthread 2
  log stdout format raw local0
defaults
  mode tcp
  timeout connect 5s
  timeout client 30m
  timeout server 30m
frontend imv2
  bind *:7443
  default_backend gateways
backend gateways
  balance leastconn
  server gateway-0 10.78.42.10:7443 check inter 1s rise 1 fall 2
  server gateway-1 10.78.42.11:7443 check inter 1s rise 1 fall 2
listen statistics
  bind *:9661
  mode http
  stats enable
  stats uri /stats
