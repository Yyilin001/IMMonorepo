# Temporary server-side override for a workstation-driven gateway load test.
# Apply it only after both the cloud security group and the host firewall
# restrict TCP/443 to the load generator's current public /32 address.
services:
  account:
    environment:
      # The account edge remains loopback-only in this stack. Raising this
      # test-only limit lets credential preparation finish before the short
      # access-token lifetime expires for the earliest records.
      IM_V2_ACCOUNT_CLIENT_RATE_LIMIT_MAX_REQUESTS: 100000

  gateway:
    environment:
      # The normal local profile intentionally allows only 1,000 commands per
      # 24-hour fenced lease. A distinct immutable profile keeps performance
      # testing from weakening or mutating that application safety contract.
      # A profile ID identifies one immutable 24-hour capacity lease. A fresh
      # campaign must seed its pools and use fresh users/rooms; existing rooms
      # remain bound to the profile under which they were created. The helper
      # script enforces that explicit setup instead of rewriting room leases.
      IM_V2_CAPACITY_PROFILE_ID: ${IM_V2_LOAD_CAPACITY_PROFILE_ID:-loadtest-v2}
      IM_V2_MAX_COMMANDS_PER_WINDOW: 100000
      # Stable pair hashing in the gateway spreads independent direct rooms
      # across admission rows while all data remains on this one PostgreSQL
      # instance. The load-test bootstrap provisions the same eight pool IDs.
      IM_V2_DIRECT_ROOM_SHARD_ID: rooms-load-00,rooms-load-01,rooms-load-02,rooms-load-03,rooms-load-04,rooms-load-05,rooms-load-06,rooms-load-07
      # Repeated runs may reuse disposable user pairs only while retaining the
      # same immutable capacity profile. A new profile requires fresh users
      # and therefore fresh direct pairs. Keep the production stranger-message
      # safety policy in the base file, but prevent a same-profile benchmark
      # from becoming a policy-limit benchmark after the third message.
      IM_V2_STRANGER_MESSAGE_MAX_PER_WINDOW: 100000
      # Every test connection intentionally starts without a saved Sync
      # cursor and can therefore drain a large historical log while sending
      # messages. Keep the production command buckets in the base file, but
      # prevent that synthetic pull/ack burst from becoming the benchmarked
      # limiter before PostgreSQL is saturated.
      IM_V2_DEVICE_COMMANDS_PER_SECOND: 256
      IM_V2_DEVICE_COMMAND_BURST: 512
      IM_V2_USER_COMMANDS_PER_SECOND: 512
      IM_V2_USER_COMMAND_BURST: 1024
      # The benchmark deliberately releases as many as 1,000 idempotent
      # open-direct-room commands in one second after connection ramp-up. Keep
      # the server override's foreground/Sync in-flight limits (32/16), but
      # give that bounded burst a larger queue and deadline so the benchmark
      # measures steady-state database capacity instead of the normal 200 ms
      # overload policy. Initial Sync pull/ack traffic can briefly exceed one
      # request per client, so its test-only queue uses the same 1,536 bound;
      # the 16-request in-flight limit still protects PostgreSQL.
      IM_V2_FOREGROUND_DATABASE_WORK_MAX_QUEUED: 1536
      IM_V2_SYNC_DATABASE_WORK_MAX_QUEUED: 1536
      IM_V2_DATABASE_WORK_ADMISSION_TIMEOUT_MS: 5000
      # Measure the single-node throughput ceiling with one shared 64-slot
      # pool. Admission, worker concurrency, batching and bounded queues remain
      # enabled; only hard per-role connection reservations are bypassed so an
      # idle worker class cannot strand capacity during a benchmark phase.
      IM_V2_DATABASE_WORKLOAD_POOL_ISOLATION_ENABLED: "false"
    ports:
      - "0.0.0.0:443:7443"
