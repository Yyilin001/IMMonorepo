# Opt-in high-activity profile for the already-enabled direct room-log path.
# It deliberately keeps the normal interactive wait at 2 ms and extends only
# batches scheduled after a bounded, monotonic sustained-arrival observation.
# Apply together with docker-compose.direct-room-log.yml and only after a
# controlled A/B proves the configured workload benefits.
services:
  gateway:
    environment:
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_SIZE: "16"
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_MAX_DELAY_MS: "2"
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_HIGH_ACTIVITY_DELAY_MS: "20"
      # A one-second, 20-request threshold filters event-loop microbursts but
      # enters high-activity mode within about 22 ms at the 900 msg/s test
      # load. Isolated and low-rate sends continue to use the base delay.
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_HIGH_ACTIVITY_MIN_REQUESTS: "20"
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_HIGH_ACTIVITY_WINDOW_MS: "1000"
      # A best-effort, process-local read cache for freshly committed plain
      # direct events. PostgreSQL still authorizes every cache hit; entries
      # are only a bounded payload/range acceleration.
      IM_V2_DIRECT_ROOM_LOG_EVENT_CACHE_MAX_ENTRIES: "32768"
      IM_V2_DIRECT_ROOM_LOG_EVENT_CACHE_MAX_BYTES: "33554432"
      IM_V2_DIRECT_ROOM_LOG_EVENT_CACHE_MAX_ENTRIES_PER_ROOM: "64"
