# Opt-in high-activity profile for the already-enabled direct room-log path.
# It deliberately keeps the normal interactive wait at 2 ms and extends only
# batches scheduled after a bounded, monotonic sustained-arrival observation.
# Apply together with docker-compose.direct-room-log.yml and only after a
# controlled A/B proves the configured workload benefits.
services:
  gateway:
    environment:
      # Two independent 1,500-online / 900-msg/s runs on the 8-vCPU test
      # host sustained ~20 committed requests per atomic append at this cap,
      # reducing commit count by about 35% versus 16 without raising P95.
      # Keep this profile single-Gateway and benchmark-specific; the runtime
      # default remains disabled for deployments that do not opt in here.
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_SIZE: "32"
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_MAX_DELAY_MS: "2"
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_HIGH_ACTIVITY_DELAY_MS: "20"
      # A 20 ms delay should not be selected merely because a two-member
      # direct room is active.  To amortise that extra wait into at least an
      # eight-request transaction, the process must observe roughly
      # 8 / 0.020 = 400 accepted arrivals per second.  The previous 20/s
      # threshold incorrectly classified a ~100 msg/s direct pair as a broad
      # fan-in workload, adding delay while forming only two-request batches.
      # A one-second 400-request window still enters long-delay mode at the
      # intended 600--900 msg/s distributed-load profile, while low-rate and
      # ordinary direct conversations remain on the 2 ms interactive bound.
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_HIGH_ACTIVITY_MIN_REQUESTS: "400"
      IM_V2_DIRECT_ROOM_LOG_APPEND_BATCH_HIGH_ACTIVITY_WINDOW_MS: "1000"
      # A best-effort, process-local read cache for freshly committed plain
      # direct events. PostgreSQL still authorizes every cache hit; entries
      # are only a bounded payload/range acceleration.
      IM_V2_DIRECT_ROOM_LOG_EVENT_CACHE_MAX_ENTRIES: "32768"
      IM_V2_DIRECT_ROOM_LOG_EVENT_CACHE_MAX_BYTES: "33554432"
      IM_V2_DIRECT_ROOM_LOG_EVENT_CACHE_MAX_ENTRIES_PER_ROOM: "64"
