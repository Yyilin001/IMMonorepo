# Room-log throughput tuning overlay. Public content always uses room logs.
services:
  gateway:
    environment:
      # Reserve shard command-window capacity in bounded durable batches for
      # the fixed-audience direct room-log path. PostgreSQL remains the
      # authority; an interrupted process can only leave up to 31 already
      # charged credits unused for its current shard/lease. Per-room admission
      # remains authoritative.
      IM_V2_DIRECT_ROOM_LOG_SHARD_CREDIT_BATCH_SIZE: "32"
