# Local-only PostgreSQL query/WAL profiling overlay. Combine this with
# docker-compose.isolated-tests.yml; it never changes the application schema
# or a production runtime configuration.
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.track_planning=on
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
  postgres-secondary:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.track_planning=on
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
