map $request_method $im_api_upstream {
    default http://127.0.0.1:__COMMAND_API_PORT__;
    GET     http://127.0.0.1:__QUERY_API_PORT__;
    HEAD    http://127.0.0.1:__QUERY_API_PORT__;
}

limit_req_zone $binary_remote_addr zone=im_auth:20m rate=__AUTH_RATE_LIMIT__;
limit_req_zone $binary_remote_addr zone=im_api:50m rate=__API_RATE_LIMIT__;
limit_conn_zone $binary_remote_addr zone=im_conn:20m;

server {
    listen __HTTP_PORT__ default_server;
    listen [::]:__HTTP_PORT__ default_server;
    server_name __SERVER_NAME__;

    server_tokens off;
    access_log /var/log/nginx/imserver_access.log;
    error_log /var/log/nginx/imserver_error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size __CLIENT_MAX_BODY_SIZE__;
    limit_conn im_conn __CONNECTION_LIMIT__;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;

    include __SNIPPET_DIR__/imserver_locations.conf;
}
