server {
    listen __HTTPS_PORT__ ssl http2;
    listen [::]:__HTTPS_PORT__ ssl http2;
    server_name __SERVER_NAME__;

    server_tokens off;
    access_log /var/log/nginx/imserver_ssl_access.log;
    error_log /var/log/nginx/imserver_ssl_error.log warn;

    ssl_certificate __LETSENCRYPT_DIR__/live/__SERVER_NAME__/fullchain.pem;
    ssl_certificate_key __LETSENCRYPT_DIR__/live/__SERVER_NAME__/privkey.pem;
    ssl_session_cache shared:IMServerSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size __CLIENT_MAX_BODY_SIZE__;
    limit_conn im_conn __CONNECTION_LIMIT__;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;

    include __SNIPPET_DIR__/imserver_locations.conf;
}
