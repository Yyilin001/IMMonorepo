location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "nginx ok\n";
}

location ^~ /.well-known/acme-challenge/ {
    root /var/www/imserver-acme;
    default_type text/plain;
    try_files $uri =404;
}

location = /health {
    proxy_pass http://127.0.0.1:__GATEWAY_HTTP_PORT__/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /internal/metrics {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:__GATEWAY_HTTP_PORT__/internal/metrics;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/auth/ {
    limit_req zone=im_auth burst=__AUTH_RATE_BURST__ nodelay;
    proxy_pass http://127.0.0.1:__GATEWAY_HTTP_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/im/ {
    limit_req zone=im_api burst=__API_RATE_BURST__ nodelay;
    proxy_pass $im_api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/ {
    limit_req zone=im_api burst=__API_RATE_BURST__ nodelay;
    proxy_pass http://127.0.0.1:__COMMAND_API_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://127.0.0.1:__GATEWAY_HTTP_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
