groups:
  - name: imserver-capacity
    rules:
      - alert: IMServerHighHTTPFailureRate
        expr: rate(im_http_request_failures_total[5m]) / clamp_min(rate(im_http_requests_total[5m]), 1) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: IMServer HTTP failure rate is above 1%

      - alert: IMServerHighHTTPLatency
        expr: im_http_request_latency_max_millis > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: IMServer max HTTP latency is above 1s

      - alert: IMServerOutboxBacklog
        expr: im_outbox_backlog_events > 10000
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: IMServer outbox backlog is accumulating

      - alert: IMServerProjectionLag
        expr: im_projection_lag_millis > 10000
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: IMServer projection lag is above 10s

      - alert: IMServerSearchLag
        expr: im_search_lag_millis > 15000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: IMServer search lag is above 15s

      - alert: IMServerCrossNodeDispatchFailures
        expr: rate(im_cross_node_dispatch_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: IMServer cross-node dispatch failures detected

      - alert: IMServerSessionCountRelayFailures
        expr: rate(im_session_count_query_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: IMServer gateway session-count relay failures detected

      - alert: IMServerRedisPresenceStaleCleanupSpike
        expr: increase(im_redis_presence_stale_cleanup_total[10m]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: IMServer Redis presence stale cleanup is elevated

      - alert: IMServerStreamFailures
        expr: rate(im_stream_failed_events_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: IMServer stream consumer failures detected

      - alert: IMServerSequenceBlockReserveFailures
        expr: rate(im_sequence_block_reserve_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: IMServer sequence block reservation failures detected

      - alert: IMServerConversationOwnerForwardFailures
        expr: rate(im_conversation_owner_forward_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: IMServer conversation owner forwarding failures detected

      - alert: IMServerConversationWriteQueueBacklog
        expr: im_conversation_write_queue_depth > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: IMServer conversation write queue depth is high

      - alert: IMServerMessageWriteBatcherInactive
        expr: rate(im_message_write_batch_messages_total[10m]) == 0 and rate(im_sequence_blocks_reserved_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: IMServer message write batcher is not batching messages
