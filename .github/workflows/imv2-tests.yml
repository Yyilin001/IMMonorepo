name: IM V2 Tests

on:
  pull_request:
    paths:
      - ".github/workflows/imv2-tests.yml"
      - "IMV2/**"
      - "IMV2Core/**"
      - "IMV2ClientKit/**"
      - "IMV2Server/**"
      - "Protocol/im_realtime/v2/**"
      - "scripts/generate_v2_protobuf.sh"
      - "scripts/check_v2_protobuf_generated.sh"
      - "scripts/generate_v2_sql_migration_manifest.sh"
      - "scripts/check_v2_sql_migration_manifest.sh"
      - "scripts/check_v2_prometheus_rules.sh"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/imv2-tests.yml"
      - "IMV2/**"
      - "IMV2Core/**"
      - "IMV2ClientKit/**"
      - "IMV2Server/**"
      - "Protocol/im_realtime/v2/**"
      - "scripts/generate_v2_protobuf.sh"
      - "scripts/check_v2_protobuf_generated.sh"
      - "scripts/generate_v2_sql_migration_manifest.sh"
      - "scripts/check_v2_sql_migration_manifest.sh"
      - "scripts/check_v2_prometheus_rules.sh"
  workflow_dispatch:

jobs:
  swift-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: im_v2_test
          POSTGRES_USER: im_v2_test
          POSTGRES_PASSWORD: im_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U im_v2_test -d im_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IMV2_POSTGRES_TEST_DATABASE_URL: postgres://im_v2_test:im_v2_test@127.0.0.1:5432/im_v2_test
      IMV2_POSTGRES_TEST_DATABASE_IS_DISPOSABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Show Swift version
        run: swift --version

      - name: Test Core
        run: swift test --package-path IMV2Core --no-parallel

      - name: Test Client
        run: swift test --package-path IMV2ClientKit --no-parallel

      - name: Test Server and PostgreSQL transactions
        run: swift test --package-path IMV2Server --no-parallel

      - name: Test local schema migration ledger
        run: bash IMV2/scripts/test_v2_local_schema_migrations.sh

      - name: Test V2 PostgreSQL logical restore drill
        run: bash IMV2/scripts/test_v2_postgres_logical_restore.sh

      - name: Verify protobuf generated sources
        run: ./scripts/check_v2_protobuf_generated.sh

      - name: Verify SQL migration manifest
        run: ./scripts/check_v2_sql_migration_manifest.sh

      - name: Validate V2 Prometheus rules
        run: ./scripts/check_v2_prometheus_rules.sh
