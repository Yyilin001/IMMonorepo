name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-and-postgres:
    name: Swift packages and PostgreSQL integration
    runs-on: ubuntu-latest
    container: swift:6.4-jammy@sha256:a6053d2de72091906bfa064f76f145e3f28830664cae250e1b84aa8c499a8ee6
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: im_v2_test
          POSTGRES_USER: im_v2_test
          POSTGRES_PASSWORD: im_v2_test
        options: >-
          --health-cmd "pg_isready -U im_v2_test -d im_v2_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
      postgres-secondary:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: im_v2_test
          POSTGRES_USER: im_v2_test
          POSTGRES_PASSWORD: im_v2_test
        options: >-
          --health-cmd "pg_isready -U im_v2_test -d im_v2_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
      postgres-control:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: im_v2_test
          POSTGRES_USER: im_v2_test
          POSTGRES_PASSWORD: im_v2_test
        options: >-
          --health-cmd "pg_isready -U im_v2_test -d im_v2_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native verification dependencies
        run: apt-get update && apt-get install --yes --no-install-recommends libsqlite3-dev ripgrep
      - name: Run package tests
        env:
          # This job runs inside a Swift container and cannot launch sibling
          # Docker containers. The following service-backed integration step
          # installs the canonical schema into a clean PostgreSQL database.
          V2_SCHEMA_BOOTSTRAP_COVERED_BY_POSTGRES_INTEGRATION: "1"
        run: bash ./scripts/run_v2_swift_tests.sh
      - name: Build Linux release products
        run: |
          for product in IMV2AccountServerApp IMV2OperatorServerApp IMV2ServerApp IMV2LocalGatewayProbe IMV2GatewayLoadGenerator; do
            swift build --disable-automatic-resolution --jobs 4 -c release --package-path IMV2Server --product "$product"
          done
      - name: Run PostgreSQL integration tests
        env:
          IMV2_POSTGRES_TEST_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_POSTGRES_TEST_SECONDARY_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres-secondary:5432/im_v2_test
          IMV2_POSTGRES_TEST_CONTROL_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres-control:5432/im_v2_test
          IMV2_POSTGRES_TEST_DATABASE_IS_DISPOSABLE: "1"
          IMV2_REQUIRE_CROSS_STORE_POSTGRES_TESTS: "1"
          # The physical-connection deadline suite uses its own explicit
          # disposable opt-in, including a pool-borrow/COMMIT fault fixture.
          IMV2_ACTOR_TRANSACTION_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_TRANSACTION_TEST_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_ACK_LOSS_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_ACK_LOSS_TEST_DATABASE_IS_DISPOSABLE: "1"
          IMV2_SHARED_SEND_ACK_LOSS_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_SHARED_SEND_ACK_LOSS_TEST_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_HOST_DRAIN_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_HOST_DRAIN_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_HOST_OVERLOAD_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_HOST_OVERLOAD_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_HOST_G2_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_HOST_G2_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_PAIR_INTERLEAVE_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_PAIR_INTERLEAVE_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_CANCEL_MAINT_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_CANCEL_MAINT_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_CREDIT_FENCE_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_CREDIT_FENCE_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_D2_TEST_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_D2_TEST_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_D4_CONTROL_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres-control:5432/im_v2_test
          IMV2_ACTOR_D4_OWNER_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_D4_TEST_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_D5_OWNER_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_D5_TEST_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_D5_SOURCE_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_D5_TARGET_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres-secondary:5432/im_v2_test
          IMV2_ACTOR_D5_IMPORT_TEST_DATABASE_IS_DISPOSABLE: "1"
          IMV2_ACTOR_D5_MEDIA_DATABASE_URL: postgres://im_v2_test:im_v2_test@postgres:5432/im_v2_test
          IMV2_ACTOR_D5_MEDIA_TEST_DATABASE_IS_DISPOSABLE: "1"
        run: swift test --disable-automatic-resolution --no-parallel --package-path IMV2Server

  room-actor-process-recovery:
    name: Linux room actor process recovery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install probe orchestration dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep openssl python3
      - name: Exercise client-first discovery and Host crash recovery
        env:
          DOCKER_CONTEXT: default
          VA_G4_MODE: linux
          VA_G4_LINUX_CLIENT_FIRST: "1"
        run: |
          export VA_G4_LINUX_SCRATCH_DIR="$RUNNER_TEMP/actor-swiftpm"
          export VA_G4_LINUX_RUN_ROOT="$RUNNER_TEMP/actor-process-evidence"
          mkdir -p "$VA_G4_LINUX_SCRATCH_DIR" "$VA_G4_LINUX_RUN_ROOT"
          bash ./IMV2/scripts/test_v2_virtual_actor_business_probe.sh
      - name: Exercise concurrent Hosts and peer-only network partition
        env:
          DOCKER_CONTEXT: default
          VA_G6_MODE: linux
        run: |
          export VA_G6_LINUX_SCRATCH_DIR="$RUNNER_TEMP/actor-swiftpm"
          export VA_G6_LINUX_RUN_ROOT="$RUNNER_TEMP/actor-process-evidence"
          python3 ./IMV2/scripts/test_v2_virtual_actor_multihost_probe.py
      - name: Upload process recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-actor-process-recovery
          path: ${{ runner.temp }}/actor-process-evidence/*-evidence/
          if-no-files-found: warn

  operational-config:
    name: Prometheus and local Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus rules and scrape configuration
        run: bash ./scripts/check_v2_prometheus_rules.sh
      - name: Validate local Compose environment isolation
        run: |
          cp ./IMV2/.env.local.example ./IMV2/.env.local
          bash ./IMV2/scripts/test_v2_local_compose_env_precedence.sh

  ios-build-for-testing:
    name: iOS build-for-testing
    runs-on: macos-26
    # The app deployment target is iOS 26.2. Pin both the hosted image and the
    # selected toolchain/runtime instead of inheriting moving `latest` aliases.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      IMAPP_UNIT_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.2
      IMAPP_UI_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.2
    steps:
      - uses: actions/checkout@v4
      - name: Build app and test bundles without signing
        run: bash ./IMApp/Scripts/verify_generic_simulator_build.sh

  ios-unit-tests:
    name: iOS unit tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      IMAPP_UNIT_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.2
      IMAPP_UI_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.2
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic App store and projection tests
        run: bash ./IMApp/Scripts/verify_unit_tests.sh

  ios-ui-tests:
    name: iOS signed-out UI tests
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      IMAPP_UNIT_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.2
      IMAPP_UI_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.2
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic signed-out accessibility UI tests
        run: bash ./IMApp/Scripts/verify_ui_tests.sh
