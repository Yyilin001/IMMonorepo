name: IMServer Multi-Cell Smoke

on:
  workflow_dispatch:
    inputs:
      failure_drill:
        description: Optional dependency recovery drill after physical Cell migration
        required: true
        default: none
        type: choice
        options:
          - none
          - redis-outage
          - kafka-outage

permissions:
  contents: read

jobs:
  multicell-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Check multi-Cell smoke wiring
        run: make check-imserver-multicell-smoke

      - name: Run physical Cell migration smoke
        run: make run-imserver-multicell-smoke

      - name: Run selected dependency recovery drill
        if: ${{ inputs.failure_drill != 'none' }}
        run: |
          cd IMServer
          ./scripts/multicell_smoke.sh failure-drill '${{ inputs.failure_drill }}'
          python3 scripts/verify_multicell_smoke.py \
            --receipt-json reports/latest-multicell-smoke.json \
            --require-pass \
            --require-artifacts-exist \
            --require-fault-drill '${{ inputs.failure_drill }}'

      - name: Upload multi-Cell reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imserver-multicell-smoke-reports
          path: |
            IMServer/reports/
          if-no-files-found: warn
