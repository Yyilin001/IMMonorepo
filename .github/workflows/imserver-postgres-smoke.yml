name: IMServer Postgres Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/imserver-postgres-smoke.yml"
      - "IMServer/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/imserver-postgres-smoke.yml"
      - "IMServer/**"
  workflow_dispatch:

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imserver_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imserver_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      IM_POSTGRES_SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/imserver_smoke

    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librdkafka-dev libsasl2-dev libssl-dev

      - name: Show Swift version
        run: swift --version

      - name: Run IMServer tests with Postgres smoke enabled
        working-directory: IMServer
        run: swift test --no-parallel
