name: Governance Boundaries

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  governance:
    name: Check governance boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run governance boundary checks
        run: ./scripts/check_governance_boundaries.sh
