name: Android 验证
on:
  pull_request:
    paths: ['IMAndroid/**', 'Protocol/im_realtime/**', '.github/workflows/android.yml']
  push:
    paths: ['IMAndroid/**', 'Protocol/im_realtime/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: 验证协议、SDK、APK 与 Lint
        working-directory: IMAndroid
        run: ./gradlew :clientkit:test :app:assembleDebug :app:lintDebug :platform:lintDebug --console=plain
      - name: 构建列表性能测试与校验报告工具
        working-directory: IMAndroid
        run: |
          ./gradlew :app:testBenchmarkUnitTest :app:assembleBenchmark :benchmark:assembleBenchmark --console=plain
          python3 -m unittest discover -s scripts -p test_benchmark_lists.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            IMAndroid/app/build/outputs/apk/debug/*.apk
            IMAndroid/app/build/outputs/apk/benchmark/*.apk
            IMAndroid/app/build/outputs/mapping/benchmark/
            IMAndroid/benchmark/build/outputs/apk/benchmark/*.apk
            IMAndroid/clientkit/build/reports/tests/
            IMAndroid/app/build/reports/lint-results-debug.*
            IMAndroid/platform/build/reports/lint-results-debug.*
