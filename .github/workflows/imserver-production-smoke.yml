name: IMServer Production Topology Smoke

on:
  workflow_dispatch:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run production topology smoke
        run: make run-imserver-production-smoke

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imserver-production-smoke-reports
          path: |
            IMServer/reports/latest-production-smoke.json
            IMServer/reports/
          if-no-files-found: warn
