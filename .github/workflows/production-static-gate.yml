permissions:
  contents: read

concurrency:
  group: production-static-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          bash --version
          python3 --version
          make --version

      - name: Run production static gate
        run: make validate-production-static
