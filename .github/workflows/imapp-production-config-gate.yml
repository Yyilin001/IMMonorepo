name: IMApp Production Config Gate

on:
  pull_request:
    paths:
      - ".github/workflows/imapp-production-config-gate.yml"
      - "IMApp/**"
      - "IMV2ClientKit/**"
      - "IMV2Core/**"
      - "IMV2Server/**"
      - "IMV2/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/imapp-production-config-gate.yml"
      - "IMApp/**"
      - "IMV2ClientKit/**"
      - "IMV2Core/**"
      - "IMV2Server/**"
      - "IMV2/**"
  workflow_dispatch:
    inputs:
      account_base_url:
        description: "Production V2 HTTPS account base URL, for example https://account.example.com"
        required: true
        type: string
      passkey_rp_id:
        description: "Passkey RP ID covering the account host, for example example.com"
        required: true
        type: string
      gateway_host:
        description: "Production V2 TLS gateway host"
        required: true
        type: string
      gateway_port:
        description: "Production V2 TLS gateway port"
        required: false
        default: "7443"
        type: string

permissions:
  contents: read

concurrency:
  group: imapp-production-config-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imapp-config:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate network config gate behavior
        run: IMAPP_NETWORK_CONFIG_SELF_TEST=true bash IMApp/Scripts/validate_network_configuration.sh

      - name: Validate development config
        env:
          IM_V2_ACCOUNT_BASE_URL: https://localhost:8443
          IM_V2_GATEWAY_HOST: localhost
          IM_V2_GATEWAY_PORT: "7443"
          IM_V2_PASSKEY_RP_ID: localhost
          IM_V2_PUSH_ENVIRONMENT: development
        run: IMAPP_NETWORK_CONFIG_MODE=development bash IMApp/Scripts/validate_network_configuration.sh

      - name: Validate Debug network defaults
        run: IMAPP_DEBUG_NETWORK_DEFAULTS_SELF_TEST=true bash IMApp/Scripts/validate_debug_network_defaults.sh

      - name: Build V2 App and test bundles for generic Simulator
        run: |
          xcodebuild build-for-testing \
            -project IMApp/IMApp.xcodeproj \
            -scheme IMApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run focused V2 App tests on a booted simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          for devices in json.load(sys.stdin)["devices"].values():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')"
          test -n "${simulator_id}"
          simulator_arch="$(uname -m)"
          case "${simulator_arch}" in
            arm64|x86_64) ;;
            *) echo "Unsupported macOS architecture: ${simulator_arch}" >&2; exit 1 ;;
          esac
          xcrun simctl boot "${simulator_id}" 2>/dev/null || true
          xcrun simctl bootstatus "${simulator_id}" -b
          xcodebuild test-without-building \
            -project IMApp/IMApp.xcodeproj \
            -scheme IMApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${simulator_id},arch=${simulator_arch}" \
            -only-testing:IMAppTests/V2ConversationStoreTests \
            -only-testing:IMAppTests/V2PushWakeSettingsTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate production config
        if: github.event_name == 'workflow_dispatch'
        env:
          IM_V2_ACCOUNT_BASE_URL: ${{ inputs.account_base_url }}
          IM_V2_GATEWAY_HOST: ${{ inputs.gateway_host }}
          IM_V2_GATEWAY_PORT: ${{ inputs.gateway_port }}
          IM_V2_PASSKEY_RP_ID: ${{ inputs.passkey_rp_id }}
          IM_V2_PUSH_ENVIRONMENT: production
        run: IMAPP_NETWORK_CONFIG_MODE=production bash IMApp/Scripts/validate_network_configuration.sh

      - name: Build Release with production config
        if: github.event_name == 'workflow_dispatch'
        env:
          IM_V2_ACCOUNT_BASE_URL: ${{ inputs.account_base_url }}
          IM_V2_GATEWAY_HOST: ${{ inputs.gateway_host }}
          IM_V2_GATEWAY_PORT: ${{ inputs.gateway_port }}
          IM_V2_PASSKEY_RP_ID: ${{ inputs.passkey_rp_id }}
          IM_V2_PUSH_ENVIRONMENT: production
        run: |
          xcodebuild build \
            -project IMApp/IMApp.xcodeproj \
            -scheme IMApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            IM_V2_ACCOUNT_BASE_URL="${IM_V2_ACCOUNT_BASE_URL}" \
            IM_V2_GATEWAY_HOST="${IM_V2_GATEWAY_HOST}" \
            IM_V2_GATEWAY_PORT="${IM_V2_GATEWAY_PORT}" \
            IM_V2_PASSKEY_RP_ID="${IM_V2_PASSKEY_RP_ID}" \
            IM_V2_PUSH_ENVIRONMENT="${IM_V2_PUSH_ENVIRONMENT}"
